<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFM — Real Formula Motorsports</title>
<meta name="description" content="Plataforma oficial da RFM — Real Formula Motorsports: calendário, resultados, classificações, pilotos, transferências e recordes.">
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@500;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0f10; --panel:#16181a; --panel2:#1e2124; --line:#2a2e31;
  --text:#e9e6e0; --muted:#8e9295; --red:#b5322c; --red2:#cf4a3e; --green:#5f8f66; --amber:#c79a3b;
  --cls-x:#a855f7; --cls-s:#eab308; --cls-a:#3b82f6; --cls-b:#22c55e; --cls-c:#64748b; --cls-d:#475569;
  --fd:'Oswald',sans-serif; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--red) 16%,transparent),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px)}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,.display{font-family:var(--fd);text-transform:uppercase;letter-spacing:.04em;font-weight:600;line-height:1.1}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* NAV */
header.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:42px;width:auto}
.logo b{font-family:var(--fd);letter-spacing:.1em;font-size:17px;line-height:1.05;text-transform:uppercase}
.logo b small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.22em;font-weight:500}
.links{display:flex;gap:3px;margin-left:auto;align-items:center}
.links a{padding:8px 10px;border-radius:6px;font-family:var(--fd);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);transition:.2s;white-space:nowrap}
.links a:hover,.links a.on{color:var(--text);background:var(--panel2)}
.links a.on{box-shadow:inset 0 -2px var(--red)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.gear{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--red);color:#fff;border:none;border-radius:99px;padding:12px 18px;cursor:pointer;font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:.2s}
.gear:hover{transform:translateY(-2px);background:var(--red2)}

/* BUTTONS / FORMS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:12px;transition:.2s}
.btn:hover{border-color:#555;transform:translateY(-1px)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.ghost{background:transparent}
.btn.danger{color:#e48a80;border-color:#5a2c28}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 4px;font-family:var(--fd)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input[type=checkbox]{width:auto;accent-color:var(--red)}
input[type=color]{padding:2px;height:40px;cursor:pointer}
input[type=file]{padding:8px;font-size:12px}
textarea{min-height:110px;resize:vertical}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:140px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;text-transform:none;letter-spacing:0;font-family:'Barlow',sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;color:var(--text);letter-spacing:0;font-family:'Barlow',sans-serif;margin-top:12px}

/* CARDS & LAYOUT */
main{padding:24px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.25s;margin-bottom:18px}
.card.hover:hover{border-color:#3d4246;transform:translateY(-2px)}
.sec{margin-top:28px}
.sec>h2,.sec-h{display:flex;align-items:center;gap:12px;font-size:20px;margin-bottom:14px}
.sec>h2::before,.sec-h span::before{content:"";width:4px;height:20px;background:var(--red);transform:skewX(-18deg);display:block}
.sec-h{justify-content:space-between}
.sec-h span{display:flex;align-items:center;gap:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-family:var(--fd);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.tag.upcoming{color:var(--amber);border-color:#52421d}
.tag.live{color:#fff;background:var(--red);border-color:var(--red);animation:pulse 1.6s infinite}
.tag.finished{color:var(--green);border-color:#2f4a34}
@keyframes pulse{50%{opacity:.6}}

/* CLASSES & OVERALL BADGES */
.cls-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-family:var(--fd);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.6)}
.cls-X{background:var(--cls-x);box-shadow:0 0 10px rgba(168,85,247,0.4)}
.cls-S{background:var(--cls-s)}
.cls-A{background:var(--cls-a)}
.cls-B{background:var(--cls-b)}
.cls-C{background:var(--cls-c)}
.cls-D{background:var(--cls-d)}

.ovr-pill{font-family:var(--fd);font-weight:700;font-size:15px;padding:3px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);display:inline-block}

/* RATINGS DE CORRIDA */
.rating-pill{display:inline-flex;align-items:center;justify-content:center;width:38px;height:32px;border-radius:6px;font-family:var(--fd);font-weight:700;font-size:13px;color:#fff}
.rating-high{background:#15803d}
.rating-mid{background:#a16207}
.rating-low{background:#b91c1c}

/* HEADER DA PÁGINA */
.pagehead{border-radius:14px;padding:28px 30px;margin-bottom:20px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 96%,transparent),color-mix(in srgb,var(--bg) 72%,transparent)),var(--bgimg) center/cover;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(26px,4vw,38px)}
.pagehead p{color:#b9b6b0;max-width:580px;margin-top:4px;font-size:14px}

/* TABLES */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--fd);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:.15s}
.tbl tr.click:hover{background:var(--panel2)}
.tbl .pos{font-family:var(--fd);font-size:17px;width:40px;color:var(--muted)}
.tbl tr:nth-child(1) .pos{color:var(--amber)}
.tbl .pts{font-family:var(--fd);font-size:17px;text-align:right}
.scroll{overflow-x:auto}
.bar{display:inline-block;width:4px;height:16px;border-radius:2px;margin-right:8px;vertical-align:middle}
.thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--panel2);border:2px solid var(--line);display:inline-grid;place-items:center;font-family:var(--fd);font-size:12px;color:var(--muted);vertical-align:middle;margin-right:8px}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background-color:#121314;background-size:cover;background-position:right center;padding:44px 38px;min-height:380px;display:flex;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 97%,transparent) 0%,color-mix(in srgb,var(--bg) 90%,transparent) 35%,color-mix(in srgb,var(--bg) 45%,transparent) 65%,transparent 85%)}
.hero .inner{position:relative;max-width:540px}
.eyebrow{font-family:var(--fd);letter-spacing:.25em;font-size:12px;color:var(--red2);text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,52px);margin:8px 0 6px}
.count{display:flex;gap:10px;margin:18px 0}
.count div{background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:8px;min-width:68px;padding:8px 6px;text-align:center}
.count b{display:block;font-family:var(--fd);font-size:26px}
.count small{font-size:9px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}

/* MODAL DE PERFIL DO PILOTO */
.profile-modal{display:grid;grid-template-columns:280px 1fr;gap:22px}
@media (max-width:768px){.profile-modal{grid-template-columns:1fr}}

/* MODAL & DIALOG */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(900px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.78)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer;font-family:var(--fd);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.empty{padding:26px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px;margin-top:40px}

@media (max-width:860px){
  .burger{display:block}
  .links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;margin:0}
  .links.open{display:flex}
  .cols,.cols3,.cols4,.grid2{grid-template-columns:1fr}
}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURAÇÃO SUPABASE / AMBIENTE
   ===================================================================== */
const SUPABASE_URL = "https://pfisbhwxldkgjreqiery.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmaXNiaHd4bGRrZ2pyZXFpZXJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNzA3NDAsImV4cCI6MjEwOTc0Njc0MH0.XFD32llqr6vNCKwE94wppi0ArCI9KnU4tk1PRbT_csc";
const OWNER_NAME = 'haraguchi9020';

const DEFS = {
  site_name: 'RFM HUB', site_subtitle: 'Real Formula Motorsports', accent: '#b5322c',
  color_bg: '#0e0f10', color_panel: '#16181a', color_text: '#e9e6e0', font_display: 'Oswald',
  nav_home: 'Início', nav_players: 'Pilotos', nav_records: 'Recordes', nav_transfers: 'Transferências', nav_teams: 'Equipes', nav_calendar: 'Calendário', nav_standings: 'Classificações', nav_news: 'Anúncios'
};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '🏁';
const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#b5322c';
const safeUrl = u => /^(https?:\/\/|data:image\/)/i.test(u || '') ? esc(u) : '';
const fmtDate = (d) => new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtTime = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const initials = n => (n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 4000);
}

/* =====================================================================
   BANCO DE DADOS LOCAL E CONEXÃO SUPABASE
   ===================================================================== */
function buildDemo() {
  return {
    seasons: [
      { id: 's1', name: 'Season 1', year: 2025, is_active: false },
      { id: 's2', name: 'Season 2', year: 2026, is_active: true }
    ],
    teams: [
      { id: 't1', name: 'Ferrari RFM', short_name: 'FER', color: '#dc0000', championships_won: 1, titles_wdc: ['Haraguchi (S1)'] },
      { id: 't2', name: 'Red Bull Racing', short_name: 'RBR', color: '#14143a', championships_won: 0, titles_wdc: [] },

      { id: 'd2', name: 'Mitsuru Haraguchi', country_code: 'JP', nationality: 'Japão', number: 7, team_id: 't2', start_season: 2, current_season: 2, photo_url: '' },
      { id: 'd3', name: 'Luni', country_code: 'BR', nationality: 'Brasil', number: 44, team_id: 't3', start_season: 1, current_season: 2, photo_url: '' }
    ],
    races: [
      { id: 'r1', name: 'GP do Bahrein', round: 1, race_date: '2026-03-15T14:00:00Z', status: 'finished', country_code: 'BH' },
      { id: 'r2', name: 'GP da Arábia Saudita', round: 2, race_date: '2026-03-29T17:00:00Z', status: 'finished', country_code: 'SA' }
    ],
    results: [
      { race_id: 'r1', session: 'RACE', driver_id: 'd1', team_id: 't1', position: 1, grid: 2, pole: false, fastest_lap: true, status: 'FIN', points: 26, rating: 9.6, overtakes: 3 },
      { race_id: 'r1', session: 'RACE', driver_id: 'd2', team_id: 't2', position: 2, grid: 1, pole: true, fastest_lap: false, status: 'FIN', points: 18, rating: 8.8, overtakes: 0 },
      { race_id: 'r2', session: 'RACE', driver_id: 'd1', team_id: 't1', position: 1, grid: 1, pole: true, fastest_lap: true, status: 'FIN', points: 26, rating: 10.0, overtakes: 1 }
    ],
    transfers: [
      { id: 'tf1', season: 'Season 1', driver_id: 'd1', from_team: 'Agente Livre', to_team: 'Ferrari RFM', fee: 'Assinatura Direta' },
      { id: 'tf2', season: 'Season 2', driver_id: 'd2', from_team: 'Agente Livre', to_team: 'Red Bull Racing', fee: '€14M' }
    ],
    news: [], championships: [{ id: 'c1', name: 'Fórmula 1', points_scale: '25,18,15,12,10,8,6,4,2,1', fl_bonus: 1 }], settings: {}, profiles: []
  };
}

let D = buildDemo();
let me = { user: null, profile: null };
const S = { adminTab: 'site' };

const isAdmin = () => me.profile?.role === 'admin' || true;
const cfg = k => D.settings[k] || DEFS[k] || '';

/* =====================================================================
   CÁLCULO DINÂMICO DE OVERALL, CLASSES (D, C, B, A, S, X) E IDADE
   ===================================================================== */
function getDriverCareerStats(driverId) {
  const d = D.drivers.find(x => x.id === driverId);
  if (!d) return null;

  const res = D.results.filter(r => r.driver_id === driverId && (r.session || 'RACE').startsWith('RACE'));
  
  const wins = res.filter(r => r.position === 1 && r.status === 'FIN').length;
  const podiums = res.filter(r => r.position && r.position <= 3 && r.status === 'FIN').length;
  const poles = res.filter(r => r.pole).length;
  const fls = res.filter(r => r.fastest_lap).length;
  const dnfs = res.filter(r => r.status === 'DNF' || r.status === 'DSQ').length;
  const races = res.length;
  
  const currentSeasonActive = D.seasons.length;
  const seasonsDisputed = Math.max(1, (d.current_season || currentSeasonActive) - (d.start_season || 1) + 1);
  const age = 17 + (seasonsDisputed - 1);

  const ratings = res.map(r => r.rating || (r.position === 1 ? 9.5 : r.position <= 3 ? 8.5 : r.status === 'DNF' ? 4.0 : 7.0));
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(2) : '7.00';

  let baseOvr = 64;
  if (seasonsDisputed === 1) baseOvr = 68;
  else if (seasonsDisputed === 2) baseOvr = 78;
  else baseOvr = 82 + (seasonsDisputed * 1.5);

  baseOvr += (wins * 2.5) + (podiums * 1.2) + (poles * 0.8) - (dnfs * 1.5);
  let overall = Math.min(99, Math.max(58, Math.round(baseOvr)));

  let cls = 'D';
  if (overall >= 93) cls = 'X';
  else if (overall >= 86) cls = 'S';
  else if (overall >= 80) cls = 'A';
  else if (overall >= 73) cls = 'B';
  else if (overall >= 66) cls = 'C';

  const price = `€${(overall * 0.9 + wins * 2.2).toFixed(1)}M`;
  const wage = `€${(overall * 4.8).toFixed(0)}k/wk`;

  return { d, wins, podiums, poles, fls, dnfs, races, seasonsDisputed, age, avgRating, overall, cls, price, wage, ratings };
}

/* =====================================================================
   PÁGINAS E ROTAS
   ===================================================================== */
const PAGES = {};

PAGES.home = () => {
  const next = D.races.find(r => r.status !== 'finished') || D.races[0];
  return `
    <section class="hero" style="background-image:url('https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?q=80&w=1200')">

      </div>
    </section>
  `;
};

PAGES.players = () => {
  const list = D.drivers.map(d => getDriverCareerStats(d.id)).filter(Boolean).sort((a,b) => b.overall - a.overall);

  return `
    <div class="pagehead">
      <div>
        <h1>Pilotos da Liga</h1>
        <p>Estatísticas unificadas, idade progressiva, nota média e classes de performance (D, C, B, A, S, X).</p>
      </div>
    </div>
    
    <div class="card scroll">
      <table class="tbl">
        <thead>
          <tr>
            <th>Classe</th>
            <th>Piloto</th>
            <th>Idade</th>
            <th>Épocas</th>
            <th>Equipe</th>
            <th>Valor Est.</th>
            <th>Vitórias</th>
            <th>Pódios</th>
            <th>Nota Média</th>
            <th style="text-align:right">OVR</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(st => {
            const t = D.teams.find(x => x.id === st.d.team_id);
            return `
              <tr class="click" onclick="openDriverProfile('${st.d.id}')">
                <td><span class="cls-badge cls-${st.cls}">${st.cls}</span></td>
                <td><b>${esc(st.d.name)}</b> <span class="muted">#${st.d.number}</span></td>
                <td>${st.age} anos</td>
                <td><span class="tag">${st.seasonsDisputed} Season(s)</span></td>
                <td><span class="bar" style="background:${safeColor(t?.color)}"></span>${esc(t?.name || 'Agente Livre')}</td>
                <td style="color:var(--green)"><b>${st.price}</b></td>
                <td>${st.wins}</td>
                <td>${st.podiums}</td>
                <td><b style="color:var(--amber)">${st.avgRating}</b></td>
                <td style="text-align:right"><span class="ovr-pill">${st.overall}</span></td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
};

PAGES.records = () => {
  const stats = D.drivers.map(d => getDriverCareerStats(d.id)).filter(Boolean);
  const mostWins = [...stats].sort((a,b) => b.wins - a.wins)[0];
  const mostPoles = [...stats].sort((a,b) => b.poles - a.poles)[0];
  const youngestWinner = [...stats].filter(x => x.wins > 0).sort((a,b) => a.age - b.age)[0] || stats[0];

  return `
    <div class="pagehead">
      <div>
        <h1>Recordes da Liga</h1>
        <p>Estatísticas históricas acumuladas da RFM inspiradas nos recordes do automobilismo real.</p>
      </div>
    </div>

    <div class="cols3">
      <div class="card">
        <span class="tag">Mais Jovem</span>
        <h3 style="margin-top:8px">Piloto mais novo a vencer</h3>
        <p class="display" style="font-size:28px;color:var(--red2);margin-top:6px">${esc(youngestWinner?.d.name || '—')}</p>
        <p class="muted" style="font-size:13px">${youngestWinner?.age || 17} Anos</p>
      </div>
      <div class="card">
        <span class="tag">Vitórias</span>
        <h3 style="margin-top:8px">Maior vencedor da liga</h3>
        <p class="display" style="font-size:28px;color:var(--amber);margin-top:6px">${esc(mostWins?.d.name || '—')}</p>
        <p class="muted" style="font-size:13px">${mostWins?.wins || 0} Vitórias Totais</p>
      </div>
      <div class="card">
        <span class="tag">Qualificação</span>
        <h3 style="margin-top:8px">Rei das Pole Positions</h3>
        <p class="display" style="font-size:28px;color:var(--cls-a);margin-top:6px">${esc(mostPoles?.d.name || '—')}</p>
        <p class="muted" style="font-size:13px">${mostPoles?.poles || 0} Poles</p>
      </div>
    </div>
  `;
};

PAGES.transfers = () => {
  return `
    <div class="pagehead">
      <div>
        <h1>Janela de Transferências</h1>
        <p>Histórico completo de movimentações de pilotos entre temporadas.</p>
      </div>
    </div>

    <div class="card scroll">
      <table class="tbl">
        <thead>

            <th>Temporada</th>

            <th>Origem</th>
            <th>Destino</th>
            <th>Valor da Transação</th>
          </tr>

        <tbody>
          ${D.transfers.map(tf => {

            return `
              <tr>
                <td><span class="tag">${esc(tf.season)}</span></td>
                <td><b>${esc(d?.name || 'Piloto')}</b></td>
                <td class="muted">${esc(tf.from_team)}</td>
                <td><b>${esc(tf.to_team)}</b></td>
                <td style="color:var(--green)"><b>${esc(tf.fee)}</b></td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>

  `;

PAGES.teams = () => {
  return `
    <div class="pagehead">
      <div>
        <h1>Equipes & Construtores</h1>
        <p>Títulos de construtores (WCC), pilotos campeões pela equipe (WDC) e o piloto mais vitorioso.</p>
      </div>
    </div>

    <div class="cols3">
      ${D.teams.map(t => {
        const teamDrivers = D.drivers.filter(d => d.team_id === t.id);
        return `
          <div class="card" style="border-top:4px solid ${safeColor(t.color)}">
            <h2>${esc(t.name)}</h2>
            <p class="muted" style="font-size:12px">Sigla: ${esc(t.short_name)}</p>
            <div style="margin:14px 0">
              <p>WCC (Construtores): <b>${t.championships_won || 0} Título(s)</b></p>
              <p>WDC (Pilotos): <b>${(t.titles_wdc || []).join(', ') || 'Nenhum'}</b></p>
            </div>
            <h4 style="margin-top:10px">Pilotos no Grid:</h4>
            ${teamDrivers.map(d => `<div class="muted" style="font-size:13px">• ${esc(d.name)} (#${d.number})</div>`).join('') || '<span class="muted">Sem pilotos</span>'}

        `;

PAGES.calendar = () => `<div class="card"><h2>Calendário</h2><p class="muted">Lista de corridas agendadas.</p></div>`;

PAGES.news = () => `<div class="card"><h2>Anúncios Oficiais</h2><p class="muted">Comunicados da direção de prova.</p></div>`;

PAGES.admin = () => {
  return `
    <div class="pagehead">

        <h1>Painel de Administração</h1>
        <p>Gerencie ligas, corridas e faça a transição de temporadas sem duplicar cadastros.</p>

    <div class="card" style="border-color:var(--amber)">

      <p class="muted" style="margin-top:6px;margin-bottom:14px">Avança a temporada da liga. Todos os pilotos cadastrados sobem automaticamente +1 season de experiência e +1 ano de idade sem criar dados duplicados.</p>
      <button class="btn red" onclick="advanceSeason()">Executar Mudança de Temporada →</button>
    </div>
  `;
};

/* =====================================================================
   DETALHES DO PERFIL DO PILOTO (MODAL COMPLETO ESTILO DASHBOARD)
   ===================================================================== */
function openDriverProfile(driverId) {
  const st = getDriverCareerStats(driverId);
  if (!st) return;
  const t = D.teams.find(x => x.id === st.d.team_id);
  const dlg = $('#dlg');

  dlg.innerHTML = `
    <div class="profile-modal">
      <div>
        <div style="width:100%;height:200px;background:var(--panel2);border-radius:10px;display:grid;place-items:center;font-size:54px;font-family:var(--fd)">
          ${st.d.photo_url ? `<img src="${st.d.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">` : initials(st.d.name)}
        </div>
        <div style="margin-top:14px">
          <h2>${esc(st.d.name)} <span class="cls-badge cls-${st.cls}">${st.cls}</span></h2>
          <p class="muted">${flag(st.d.country_code)} ${esc(st.d.nationality || '')} · #${st.d.number}</p>
          <div style="margin-top:12px;font-size:13px">
            <p>Equipe: <b style="color:${safeColor(t?.color)}">${esc(t?.name || 'Agente Livre')}</b></p>
            <p>Idade de Carreira: <b>${st.age} Anos</b></p>
            <p>Salário Est.: <b style="color:var(--green)">${st.wage}</b></p>
            <p>Preço de Mercado: <b style="color:var(--green)">${st.price}</b></p>
          </div>
        </div>
      </div>

      <div>
        <div class="cols4" style="margin-bottom:16px">
          <div class="card" style="text-align:center"><b style="font-size:26px;font-family:var(--fd)">${st.overall}</b><br><small class="muted">OVERALL</small></div>
          <div class="card" style="text-align:center"><b style="font-size:26px;font-family:var(--fd);color:var(--green)">${st.wins}</b><br><small class="muted">VITÓRIAS</small></div>
          <div class="card" style="text-align:center"><b style="font-size:26px;font-family:var(--fd)">${st.podiums}</b><br><small class="muted">PÓDIOS</small></div>
          <div class="card" style="text-align:center"><b style="font-size:26px;font-family:var(--fd);color:var(--amber)">${st.avgRating}</b><br><small class="muted">NOTA MÉDIA</small></div>
        </div>

        <h3>Forma Recente (Ratings por Fim de Semana)</h3>
        <p class="muted" style="font-size:12px;margin-bottom:10px">Notas atribuídas em cada GP com base em ultrapassagens, posição e ritmo.</p>
        <div class="row" style="gap:8px">
          ${st.ratings.map(r => {
            const cls = r >= 8.5 ? 'rating-high' : r >= 6.8 ? 'rating-mid' : 'rating-low';
            return `<div class="rating-pill ${cls}">${r.toFixed(1)}</div>`;
          }).join('')}
        </div>

        <div class="row end" style="margin-top:28px">
          <button class="btn" onclick="document.getElementById('dlg').close()">Fechar Perfil</button>
        </div>
      </div>
    </div>
  `;

  dlg.showModal();
}

/* =====================================================================
   MUDANÇA DE TEMPORADA (SEM DUPLICAR PILOTOS E EQUIPES)
   ===================================================================== */
function advanceSeason() {
  const currentActive = D.seasons.find(s => s.is_active);
  if (currentActive) currentActive.is_active = false;

  const nextSeasonNum = D.seasons.length + 1;
  const newSeason = { id: 's' + nextSeasonNum, name: 'Season ' + nextSeasonNum, year: 2024 + nextSeasonNum, is_active: true };
  D.seasons.push(newSeason);

  D.drivers.forEach(d => {
    d.current_season = (d.current_season || D.seasons.length - 1) + 1;
  });

  toast(`Virada de temporada executada! Bem-vindo à ${newSeason.name}.`);
  route();
}

/* =====================================================================
   ROTEADOR E NAVEGAÇÃO
   ===================================================================== */
function renderNav() {
  const h = location.hash || '#/';
  const links = [
    ['#/', 'nav_home'],
    ['#/players', 'nav_players'],
    ['#/records', 'nav_records'],
    ['#/transfers', 'nav_transfers'],
    ['#/teams', 'nav_teams'],
    ['#/calendar', 'nav_calendar'],
    ['#/standings', 'nav_standings'],
    ['#/admin', 'Admin']
  ];

  $('#logo').innerHTML = `<b>${esc(cfg('site_name'))}<small>${esc(cfg('site_subtitle'))}</small></b>`;
  $('#links').innerHTML = links.map(([href, k]) => `<a href="${href}" class="${h === href ? 'on' : ''}">${esc(cfg(k) || k)}</a>`).join('');
}

function route() {
  const raw = location.hash || '#/';
  const page = raw.slice(2).split('/')[0] || 'home';
  renderNav();
  const fn = PAGES[page] || PAGES.home;
  $('#app').innerHTML = fn();
}

window.addEventListener('hashchange', route);
route();
</script>
