<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Liga</title>
<meta name="description" content="Plataforma oficial da RFM — Real Formula Motorsports: calendário, resultados, classificações, pilotos e equipes.">
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@500;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0f10; --panel:#16181a; --panel2:#1e2124; --line:#2a2e31;
  --text:#e9e6e0; --muted:#8e9295; --red:#b5322c; --red2:#cf4a3e; --green:#5f8f66; --amber:#c79a3b;
  --fd:'Oswald',sans-serif; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--red) 16%,transparent),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px)}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,.display{font-family:var(--fd);text-transform:uppercase;letter-spacing:.04em;font-weight:600;line-height:1.1}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* NAV */
header.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:44px;width:auto}
.logo b{font-family:var(--fd);letter-spacing:.1em;font-size:17px;line-height:1.05;text-transform:uppercase}
.logo b small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.22em;font-weight:500}
.links{display:flex;gap:4px;margin-left:auto;align-items:center}
.links a{padding:8px 12px;border-radius:6px;font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);transition:.2s}
.links a:hover,.links a.on{color:var(--text);background:var(--panel2)}
.links a.on{box-shadow:inset 0 -2px var(--red)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.demo-bar{background:#2a2113;color:#e2c27d;font-size:13px;text-align:center;padding:6px 12px;border-bottom:1px solid #3d2f18}
.gear{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--red);color:#fff;border:none;border-radius:99px;padding:12px 18px;cursor:pointer;font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);transition:.2s}
.gear:hover{transform:translateY(-2px);background:var(--red2)}

/* BUTTONS / FORMS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--fd);text-transform:uppercase;letter-spacing:.08em;font-size:13px;transition:.2s}
.btn:hover{border-color:#555;transform:translateY(-1px)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.ghost{background:transparent}
.btn.danger{color:#e48a80;border-color:#5a2c28}
label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 4px;font-family:var(--fd)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input[type=checkbox]{width:auto;accent-color:var(--red)}
input[type=color]{padding:2px;height:40px;cursor:pointer}
input[type=file]{padding:8px;font-size:13px}
textarea{min-height:110px;resize:vertical}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:140px}
.hint{font-size:12px;color:var(--muted);margin-top:4px;text-transform:none;letter-spacing:0;font-family:'Barlow',sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.imgf .prev{height:70px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#0a0a0b;margin-bottom:6px;padding:4px}
.imgf input[type=url]{margin-bottom:6px}
.chk{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text);letter-spacing:0;font-family:'Barlow',sans-serif;margin-top:14px}

/* LAYOUT */
main{padding:28px 0 60px;animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.25s}
.card.hover:hover{border-color:#3d4246;transform:translateY(-2px)}
.sec{margin-top:36px}
.sec>h2,.sec-h{display:flex;align-items:center;gap:12px;font-size:22px;margin-bottom:16px}
.sec>h2::before,.sec-h span::before{content:"";width:5px;height:22px;background:var(--red);transform:skewX(-18deg);display:block}
.sec-h{justify-content:space-between}
.sec-h span{display:flex;align-items:center;gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-family:var(--fd);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.tag.upcoming{color:var(--amber);border-color:#52421d}
.tag.live{color:#fff;background:var(--red);border-color:var(--red);animation:pulse 1.6s infinite}
.tag.finished{color:var(--green);border-color:#2f4a34}
.tag.pin,.tag.owner{color:var(--amber);border-color:#52421d}
@keyframes pulse{50%{opacity:.6}}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background-color:#121314;background-size:cover;background-position:right center;padding:48px 40px;min-height:430px;display:flex;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 97%,transparent) 0%,color-mix(in srgb,var(--bg) 90%,transparent) 30%,color-mix(in srgb,var(--bg) 45%,transparent) 58%,transparent 82%)}
.hero .inner{position:relative;max-width:540px}
.hero.sm{min-height:240px;padding:34px 36px}
.eyebrow{font-family:var(--fd);letter-spacing:.3em;font-size:12px;color:var(--red2);text-transform:uppercase}
.hero h1{font-size:clamp(32px,5vw,56px);margin:10px 0 6px}
.hero p{color:#b9b6b0}
.count{display:flex;gap:10px;margin:22px 0}
.count div{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:8px;min-width:72px;padding:10px 8px;text-align:center}
.count b{display:block;font-family:var(--fd);font-size:30px;letter-spacing:.04em}
.count small{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.pagehead{border-radius:14px;padding:30px 32px;margin-bottom:24px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 96%,transparent),color-mix(in srgb,var(--bg) 72%,transparent)),var(--bgimg) center/cover;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(28px,4vw,40px)}
.pagehead p{color:#b9b6b0;max-width:560px;margin-top:6px}
.partner{margin-top:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d0d10}
.partner img{width:100%;max-height:120px;object-fit:contain}
.pinned{border-color:#52421d;background:linear-gradient(90deg,#211b10,var(--panel))}

/* TABLES */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--fd);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:.15s}
.tbl tr.click:hover{background:var(--panel2)}
.tbl .pos{font-family:var(--fd);font-size:18px;width:44px;color:var(--muted)}
.tbl tr:nth-child(1) .pos{color:var(--amber)}
.tbl .pts{font-family:var(--fd);font-size:18px;text-align:right}
.scroll{overflow-x:auto}
.bar{display:inline-block;width:4px;height:18px;border-radius:2px;margin-right:10px;vertical-align:middle}
.num{font-family:var(--fd);color:var(--muted);margin-left:6px}
.thumb{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--panel2);border:2px solid var(--line);display:inline-grid;place-items:center;font-family:var(--fd);font-size:13px;color:var(--muted);vertical-align:middle;margin-right:10px;flex:none}
.tlogo{display:inline-block;vertical-align:middle;margin-right:8px;object-fit:contain}

/* CARDS */
.race-card{display:flex;gap:14px;align-items:center}
.race-card .date{font-family:var(--fd);text-align:center;min-width:56px;border-right:1px solid var(--line);padding-right:14px}
.race-card .date b{display:block;font-size:26px}
.race-card .date small{color:var(--red2);letter-spacing:.15em;text-transform:uppercase;font-size:11px}
.news-card h3{font-size:18px;margin:8px 0}
.news-card .img{height:150px;border-radius:8px;margin-bottom:12px;background:linear-gradient(135deg,#25282b,#15171a);background-size:cover;background-position:center}
.news-card p.body{white-space:pre-line}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-size:28px;color:var(--muted)}
.drv-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.drv-head .big{font-size:84px;font-family:var(--fd);color:var(--red);line-height:1;opacity:.9}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:32px}
.stat small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer;font-family:var(--fd);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.drv-card{text-align:center}
.drv-card .avatar{margin:0 auto 10px;width:96px;height:96px}

/* CALENDAR GRID */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-family:var(--fd);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.12em;padding:4px}
.cal .d{min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--muted)}
.cal .d.race{background:color-mix(in srgb,var(--red) 18%,var(--panel));border-color:var(--red);cursor:pointer;color:var(--text)}
.cal .d.race span{display:block;font-size:11px;color:var(--red2);margin-top:2px;line-height:1.2}
.cal .d.today{box-shadow:inset 0 0 0 1px var(--amber)}

/* ADMIN */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h3{margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.auth{max-width:420px;margin:30px auto}
.auth h2{margin-bottom:6px}
.empty{padding:26px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}
footer .foot{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
footer img{height:46px;width:auto}
footer a{color:var(--text);margin-left:12px;text-decoration:underline;text-underline-offset:3px}
.skel{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--panel) 0,var(--panel2) 50%,var(--panel) 100%);background-size:200%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:860px){
  .burger{display:block}
  .links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;margin:0}
  .links.open{display:flex}
  .cols,.cols3,.grid2{grid-template-columns:1fr}
  .hero{padding:28px 22px;min-height:380px;background-position:70% center;align-items:flex-end}
  .hero::before{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 94%,transparent) 70%)}
  .count b{font-size:24px}.count div{min-width:60px}
  .drv-head .big{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- pontuação ---------- */
function calcPoints(r, c) {
  const scale = String(c?.points_scale || '25,18,15,12,10,8,6,4,2,1').split(',').map(Number);
  if (r.session && !r.session.startsWith('RACE')) return 0;
  const sprint = r.session === 'RACE SPRINT';
  if (sprint) scale.splice(0, scale.length, 8, 7, 6, 5, 4, 3, 2, 1);
  const bonus = sprint ? 0 : (c?.fl_bonus ?? 1);
  let b = 0;
  if (r.status === 'FIN' && r.position >= 1 && r.position <= scale.length) { b = scale[r.position - 1]; if (r.fastest_lap) b += bonus; }
  return Math.max(0, b - (r.penalty_points || 0));
}
function buildDemo() {
  return { teams: [], drivers: [], seasons: [], championships: [], races: [], results: [], news: [], profiles: [], settings: {} };
}

/* =====================================================================
   MODO LOCAL — mini Supabase no navegador
   ===================================================================== */
function makeLocal() {
  const KEY = 'rfm_local_v4', SK = 'rfm_local_session', listeners = [];

  const init = async () => {
    try { db = await idbGet(KEY); } catch {}
    if (!db) { try { db = JSON.parse(ls.get(KEY)); } catch {} }
    if (!db) { const d = buildDemo(); db = { ...d, profiles: [], settings: [], audit_log: [], users: [], storage: {} }; }
    try { await idbSet(KEY, db); ls.del(KEY); } catch {}
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  };
  const iso = () => new Date().toISOString();
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2) + Date.now().toString(36));
  let pending = Promise.resolve();
  const save = () => { pending = pending.then(() => idbSet(KEY, db)).catch(() => { try { toast('Não foi possível salvar no navegador (armazenamento cheio ou bloqueado).', true); } catch {} }); };
  window.addEventListener('pagehide', () => { try { idbSet(KEY, db); } catch {} });

  const sess = () => ls.get(SK);
  const P = () => db.profiles.find(p => p.id === sess());
  const adm = () => { const p = P(); return !!p && p.role === 'admin' && p.status === 'active'; };
  const stf = () => { const p = P(); return !!p && ['admin', 'staff'].includes(p.role) && p.status === 'active'; };
  const isOwnerL = () => adm() && P().username.toLowerCase() === OWNER_NAME;
  const allow = (t, row) => adm() || (stf() && ['races', 'results', 'news'].includes(t)) || (t === 'teams' && !!sess() && row && row.principal_id === sess()) || (t === 'profiles' && row && row.id === sess());
  const AUD = ['profiles', 'teams', 'drivers', 'seasons', 'championships', 'races', 'results', 'news', 'settings'];
  const slim = o => o && Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'string' && v.length > 200 ? '(imagem)' : v]));
  const aud = (op, t, o, n) => {
    if (!AUD.includes(t)) return; const r = n || o;
    db.audit_log.unshift({ id: Date.now() + Math.random(), user_id: sess(), action: op, table_name: t, row_id: String(t === 'settings' ? r.key : r.id), old_data: slim(o), new_data: slim(n), created_at: iso() });
    if (db.audit_log.length > 300) db.audit_log.length = 300;
  };
  const LDEF = { drivers: { active: true, titles: 0 }, news: { published: true, pinned: false, kind: 'anuncio' }, races: { status: 'upcoming', kind: 'race', format: 'f3' }, results: { session: 'RACE', status: 'FIN', penalty_seconds: 0, penalty_points: 0, fastest_lap: false, pole: false, points: 0 }, seasons: { is_active: false }, championships: { points_scale: '25,18,15,12,10,8,6,4,2,1', fl_bonus: 1 }, teams: { color: '#b5322c' } };
  const calcRow = r => {
    if (!r.team_id) r.team_id = db.drivers.find(d => d.id === r.driver_id)?.team_id || null;
    const race = db.races.find(x => x.id === r.race_id), ch = race && db.championships.find(c => c.id === race.championship_id);
    r.points = calcPoints(r, ch);
  };
  const casc = (t, id) => {
    if (t === 'championships') { db.races.filter(r => r.championship_id === id).forEach(r => casc('races', r.id)); db.races = db.races.filter(r => r.championship_id !== id);
      db.teams.forEach(x => { if (x.championship_id === id) x.championship_id = null; }); db.drivers.forEach(x => { if (x.championship_id === id) x.championship_id = null; }); }
    if (t === 'races') db.results = db.results.filter(r => r.race_id !== id);
    if (t === 'drivers') db.results = db.results.filter(r => r.driver_id !== id);
    if (t === 'teams') { db.drivers.forEach(x => { if (x.team_id === id) x.team_id = null; }); db.results.forEach(x => { if (x.team_id === id) x.team_id = null; }); }
    if (t === 'seasons') db.championships.filter(c => c.season_id === id).forEach(c => { casc('championships', c.id); db.championships = db.championships.filter(x => x.id !== c.id); });
  };
  const guardProfile = (old, nw) => {
    if (old.username.toLowerCase() === OWNER_NAME) {
      if (nw.role !== 'admin' || nw.status !== 'active') throw new Error('A conta principal não pode perder o acesso.');
      if (nw.username.toLowerCase() !== OWNER_NAME) throw new Error('O nome da conta principal não pode ser alterado.');
    }
    if ((nw.role !== old.role || nw.status !== old.status) && !adm()) throw new Error('Sem permissão para alterar cargo ou estado.');
    if (nw.role !== old.role && (nw.role === 'admin' || old.role === 'admin') && !isOwnerL()) throw new Error('Somente a conta principal pode dar ou tirar o cargo de administrador.');
    if (db.profiles.some(p => p.id !== old.id && p.username.toLowerCase() === nw.username.toLowerCase())) throw new Error('duplicate key value violates unique constraint "profiles_username_lower"');
  };
  class Q {
    constructor(t, op, pay, opt) { this.t = t; this.op = op; this.pay = pay; this.opt = opt || {}; this.f = []; this.ord = null; this.lim = null; this.sel = op === 'select'; this.one = null; }

    limit(n) { this.lim = n; return this; }

    single() { this.one = 'single'; return this; }
    then(a, b) { return this.run().then(a, b); }

      return { data: out[0], error: null };
    }
    async run() {
      try {
        const t = this.t, rows = db[t];
        if (!rows) throw new Error('Tabela inexistente: ' + t);
        const flt = r => this.f.every(fn => fn(r));
        const deny = () => new Error('new row violates row-level security policy for table "' + t + '"');
        if (this.op === 'select') {
          let out = rows.filter(flt);
          if (t === 'profiles' && !stf()) out = out.filter(r => r.id === sess());
          if (t === 'news' && !stf()) out = out.filter(r => r.published);
          if (t === 'audit_log' && !adm()) out = [];
          if (this.ord) { const [c, asc] = this.ord; out = [...out].sort((a, b) => (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * (asc ? 1 : -1)); }
          if (this.lim) out = out.slice(0, this.lim);
          return this.fin(out.map(r => ({ ...r })));
        }
        if (this.op === 'insert' || this.op === 'upsert') {
          const arr = Array.isArray(this.pay) ? this.pay : [this.pay], made = [];
          const keys = (this.opt.onConflict || 'id').split(',');
          for (const x of arr) {
            const ex = this.op === 'upsert' ? rows.find(r => keys.every(k => (k === 'session' ? sx(r) : r[k]) === x[k])) : null;
            if (ex) { if (!allow(t, ex)) throw deny(); const old = { ...ex }; Object.assign(ex, x); if (t === 'results') calcRow(ex); aud('UPDATE', t, old, ex); made.push(ex); continue; }
            if (!allow(t, x)) throw deny();
            const r = { id: uid(), ...(LDEF[t] || {}), ...x };
            if (['news', 'teams', 'drivers', 'profiles'].includes(t) && !r.created_at) r.created_at = iso();
            if (t === 'results') { calcRow(r); if (rows.some(q => q.race_id === r.race_id && q.driver_id === r.driver_id && sx(q) === sx(r))) throw new Error('duplicate key value violates unique constraint'); }
            rows.push(r); aud('INSERT', t, null, r); made.push(r);
          }
          save(); return this.sel ? this.fin(made.map(r => ({ ...r }))) : { data: null, error: null };
        }
        if (this.op === 'update') {
          const hit = rows.filter(flt), done = [];
          for (const r of hit) {
            if (!allow(t, r)) throw deny();
            const old = { ...r }; if (t === 'profiles') guardProfile(old, { ...r, ...this.pay });
            Object.assign(r, this.pay);
            if (t === 'results') calcRow(r);
            if (t === 'championships' && (old.points_scale !== r.points_scale || old.fl_bonus !== r.fl_bonus)) { const ids = db.races.filter(x => x.championship_id === r.id).map(x => x.id); db.results.filter(x => ids.includes(x.race_id)).forEach(calcRow); }
            aud('UPDATE', t, old, r); done.push(r);

    async rpc(name, a) {

      const pr = db.profiles.find(p => p.id === a.target), u = db.users.find(x => x.id === a.target);

      if (pr.role === 'admin' && !isOwnerL() && a.target !== sess()) return { error: { message: 'Somente a conta principal pode redefinir a senha de um administrador.' } };

    }
  };
}

/* ---------- carregamento ---------- */
async function loadData() {
  const q = (t, f) => { let r = sb.from(t).select('*'); return f ? f(r) : r; };
  const [teams, drivers, seasons, championships, races, results, news, settings] = await Promise.all([
    q('teams'), q('drivers'), q('seasons', r => r.order('year', { ascending: false })), q('championships'),
    q('races', r => r.order('race_date')), q('results'), q('news', r => r.order('created_at', { ascending: false })), q('settings')
  ]);
  const err = [teams, drivers, seasons, championships, races, results, news].find(x => x.error);
  if (err) toast('Erro ao carregar dados: ' + err.error.message + ' (você rodou o schema.sql?)', true);
  const set = {}; (settings.data || []).forEach(r => { if (r.value) set[r.key] = r.value; });
  D = { teams: teams.data || [], drivers: drivers.data || [], seasons: seasons.data || [], championships: championships.data || [],
        races: races.data || [], results: results.data || [], news: news.data || [], profiles: [], settings: set };
  if (isStaff()) { const p = await sb.from('profiles').select('*').order('created_at', { ascending: false }); D.profiles = p.data || []; }
  pickChamp(); applySettings();
}
function pickChamp() {
  if (S.champ && champOf(S.champ)) return;
  const act = D.seasons.find(s => s.is_active);
  const c = D.championships.find(c => act && c.season_id === act.id) || D.championships[D.championships.length - 1];
  S.champ = c ? c.id : null;
}
async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  me.user = session?.user || null; me.profile = null;
  if (me.user) { const { data } = await sb.from('profiles').select('*').eq('id', me.user.id).maybeSingle(); me.profile = data; }
}

function mix(hex, p) {
  const n = parseInt(safeColor(hex).slice(1, 7), 16), f = c => Math.round(c + (255 - c) * p);
  return `rgb(${f((n >> 16) & 255)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

/* ---------- classificações ---------- */
function standings(cid) {
  const raceIds = new Set(D.races.filter(r => r.championship_id === cid && sessOf(r) === 'race').map(r => r.id));
  const allRes = D.results.filter(r => raceIds.has(r.race_id));
  
  const inCat = x => !x.championship_id || x.championship_id === cid;
  const agg = (dId) => {
    const rsRace = allRes.filter(r => r.driver_id === dId && sx(r).startsWith('RACE'));
    const driverRaceIds = [...new Set(allRes.filter(r => r.driver_id === dId).map(r => r.race_id))];
    
    let polesCount = 0;
    driverRaceIds.forEach(rId => {
      const rResults = allRes.filter(r => r.driver_id === dId && r.race_id === rId);
      const hasPole = rResults.some(r => r.pole || (sx(r).startsWith('RACE') && r.grid === 1));
      if (hasPole) polesCount++;
    });

    const flCount = allRes.filter(r => r.driver_id === dId && r.fastest_lap).length;

    return {
      pts: rsRace.reduce((a, r) => a + Number(r.points || 0), 0),
      wins: rsRace.filter(r => r.position === 1 && r.status === 'FIN').length,
      pod: rsRace.filter(r => r.position && r.position <= 3 && r.status === 'FIN').length,
      poles: polesCount,
      fls: flCount,
      n: rsRace.length
    };
  };
  
  const sort = (a, b) => b.pts - a.pts || b.wins - a.wins || b.pod - a.pod;
  const drivers = D.drivers.filter(d => d.active !== false && inCat(d)).map(d => ({ d, ...agg(d.id) })).sort(sort);
  const teams = D.teams.filter(inCat).map(t => {
    const tRaceRes = allRes.filter(r => r.team_id === t.id && sx(r).startsWith('RACE'));
    return {
      t,
      pts: tRaceRes.reduce((a, r) => a + Number(r.points || 0), 0),
      wins: tRaceRes.filter(r => r.position === 1 && r.status === 'FIN').length,
      pod: tRaceRes.filter(r => r.position && r.position <= 3 && r.status === 'FIN').length,
      n: tRaceRes.length
    };
  }).sort(sort);
  
  return { drivers, teams };
}
const champSel = (key = 'champ') => D.championships.length > 1 ? `<select data-change="${key}" style="width:auto;min-width:220px" aria-label="Categoria">${D.championships.map(c => `<option value="${c.id}" ${c.id === S.champ ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : '';
const sortedNews = () => [...D.news].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.created_at) - new Date(a.created_at));

/* ---------- componentes ---------- */
const pageHead = (title, sub, right, img, color) => `<div class="pagehead" style="--bgimg:url('${safeUrl(img || cfg('track_image'))}');${color ? `border-left:5px solid ${safeColor(color)}` : ''}"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="row">${right || ''}</div></div>`;
const avatarHTML = (d, cls = 'thumb') => safeUrl(d.photo_url) ? `<img class="${cls}" src="${safeUrl(d.photo_url)}" alt="">` : `<span class="${cls}">${initials(d.name)}</span>`;
const teamLogo = (t, h = 22) => safeUrl(t?.logo_url) ? `<img class="tlogo" src="${safeUrl(t.logo_url)}" alt="" style="height:${h}px;width:auto;max-width:${h * 2}px">` : '';

function raceCard(r) {
  const d = new Date(r.race_date);
  return `<a href="#/race/${r.id}" class="card hover race-card"><div class="date"><b>${d.getDate()}</b><small>${d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}</small></div>
  <div style="flex:1;min-width:0"><div class="muted" style="font-size:12px">${roundLbl(r)}</div><h3 style="font-size:17px">${flag(r.country_code)} ${esc(r.name)}</h3>
  <div class="muted" style="font-size:13px">${esc(r.circuit || '')} · ${fmtTime(r.race_date)}</div></div><span class="tag ${r.status}">${STATUS[r.status]}</span></a>`;
}
function raceCardAdm(r) {
  return `<div>${raceCard(r)}${isStaff() ? `<div class="row end" style="margin-top:6px"><button class="btn sm" data-act="entEdit" data-v="races" data-id="${r.id}">Editar</button><button class="btn sm danger" data-act="entDel" data-v="races" data-id="${r.id}">Excluir</button></div>` : ''}</div>`;
}
function newsCard(n, full) {
  const body = n.body || '';
  return `<article class="card news-card hover ${n.pinned ? 'pinned' : ''}">${safeUrl(n.image_url) ? `<div class="img" style="background-image:url('${safeUrl(n.image_url)}')"></div>` : ''}
  <div class="row" style="gap:6px"><span class="tag">${KINDS[n.kind] || 'Anúncio'}</span>${n.pinned ? '<span class="tag pin">📌 Fixado</span>' : ''}<span class="muted" style="font-size:12px">${fmtDate(n.created_at)}</span></div>
  <h3>${esc(n.title)}</h3><p class="muted body">${esc(full ? body : body.slice(0, 130) + (body.length > 130 ? '…' : ''))}</p>
  ${isStaff() ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-act="entEdit" data-v="news" data-id="${n.id}">Editar</button><button class="btn sm danger" data-act="entDel" data-v="news" data-id="${n.id}">Excluir</button></div>` : ''}</article>`;
}
function driverTable(rows, limit) {
  const list = limit ? rows.slice(0, limit) : rows;
  if (!list.length) return '<div class="empty">Sem pilotos cadastrados.</div>';
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Pos</th><th>Piloto</th><th>Equipe</th><th>V</th><th>P</th><th style="text-align:right">Pts</th></tr></thead><tbody>
  ${list.map((x, i) => { const t = teamOf(x.d.team_id); return `<tr class="click" data-go="#/driver/${x.d.id}"><td class="pos">${i + 1}</td>
  <td style="white-space:nowrap"><span class="bar" style="background:${safeColor(t?.color)}"></span>${avatarHTML(x.d, 'thumb')}${flag(x.d.country_code)} <b>${esc(x.d.name)}</b><span class="num">${x.d.number ?? ''}</span></td>
  <td class="muted" style="white-space:nowrap">${teamLogo(t)}${esc(t?.name || '—')}</td><td>${x.wins}</td><td>${x.pod}</td><td class="pts">${x.pts}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function teamTable(rows) {
  if (!rows.length) return '<div class="empty">Sem equipes cadastradas.</div>';
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Pos</th><th>Equipe</th><th>V</th><th>P</th><th style="text-align:right">Pts</th></tr></thead><tbody>
  ${rows.map((x, i) => `<tr><td class="pos">${i + 1}</td><td style="white-space:nowrap"><span class="bar" style="background:${safeColor(x.t.color)}"></span>${teamLogo(x.t, 26)}<b>${esc(x.t.name)}</b></td><td>${x.wins}</td><td>${x.pod}</td><td class="pts">${x.pts}</td></tr>`).join('')}</tbody></table></div>`;
}
function resultTable(raceId) {
  const race = D.races.find(x => x.id === raceId), nav = race ? sessNav(race) : '', cs = race ? curSess(race) : 'RACE';
  const rs = D.results.filter(r => r.race_id === raceId && sx(r) === cs).sort((a, b) => (a.position ?? 99) - (b.position ?? 99));
  if (!rs.length) return nav + '<div class="empty">Resultados ainda não publicados' + (nav ? ' para ' + cs : '') + '.</div>';
  return nav + `<div class="scroll"><table class="tbl"><thead><tr><th>Pos</th><th>Piloto</th><th>Equipe</th><th>${isTimed(cs) ? 'Tempo' : 'Grid'}</th><th>Estado</th><th>Pen.</th><th style="text-align:right">Pts</th></tr></thead><tbody>
  ${rs.map(r => { const d = driverOf(r.driver_id), t = teamOf(r.team_id); return `<tr><td class="pos">${r.status === 'FIN' ? (r.position ?? '—') : r.status}</td>
  <td style="white-space:nowrap"><span class="bar" style="background:${safeColor(t?.color)}"></span><b>${esc(d?.name || '?')}</b>${r.pole ? ' <span class="tag">Pole</span>' : ''}${r.fastest_lap ? ' <span class="tag">VR</span>' : ''}</td>
  <td class="muted" style="white-space:nowrap">${teamLogo(t, 20)}${esc(t?.name || '—')}</td><td>${isTimed(cs) ? esc(r.lap_time || '—') : (r.grid ?? '—')}</td><td>${r.status}</td>
  <td class="muted">${r.penalty_seconds ? '+' + r.penalty_seconds + 's ' : ''}${r.penalty_points ? '−' + r.penalty_points + 'pts' : ''}${!r.penalty_seconds && !r.penalty_points ? '—' : ''}</td><td class="pts">${r.points}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function resultTableTop(raceId, n) {
  const rs = mainRes(raceId).filter(r => r.status === 'FIN').sort((a, b) => a.position - b.position).slice(0, n);
  return `<table class="tbl"><tbody>${rs.map(r => { const d = driverOf(r.driver_id), t = teamOf(r.team_id); return `<tr><td class="pos">${r.position}</td><td><span class="bar" style="background:${safeColor(t?.color)}"></span>${esc(d?.name || '?')}</td><td class="muted" style="white-space:nowrap">${teamLogo(t, 18)}${esc(t?.short_name || t?.name || '')}</td><td class="pts">${r.points}</td></tr>`; }).join('')}</tbody></table>`;
}

/* ---------- páginas ---------- */
const PAGES = {};
const nextRace = () => D.races.filter(r => r.status !== 'finished').sort((a, b) => new Date(a.race_date) - new Date(b.race_date))[0];
const on = k => cfg(k) !== '0';

PAGES.home = () => {
  const nr = nextRace(), st = standings(S.champ);
  const lastRace = [...D.races].filter(r => r.status === 'finished' && D.results.some(x => x.race_id === r.id)).sort((a, b) => new Date(b.race_date) - new Date(a.race_date))[0];
  const upcoming = D.races.filter(r => r.status !== 'finished').sort((a, b) => new Date(a.race_date) - new Date(b.race_date)).slice(0, 4);
  const banner = safeUrl(cfg('partner_banner'));
  const blockLast = `<div><h2 class="sec-h"><span>Últimos resultados</span>${lastRace ? `<a class="btn sm ghost" href="#/race/${lastRace.id}">Ver tudo</a>` : ''}</h2>
      <div class="card">${lastRace ? `<p class="muted" style="margin-bottom:8px">${flag(lastRace.country_code)} ${esc(lastRace.name)} · ${fmtDate(lastRace.race_date)}</p>${resultTableTop(lastRace.id, 8)}` : '<div class="empty">Ainda sem resultados.</div>'}</div></div>`;
  const blockNext = `<div><h2 class="sec-h"><span>Próximas corridas</span><a class="btn sm ghost" href="#/calendar">Calendário</a></h2>
      <div style="display:grid;gap:10px">${upcoming.length ? upcoming.map(raceCard).join('') : '<div class="card empty">Sem corridas agendadas.</div>'}</div></div>`;
  const blockDrv = `<div><h2 class="sec-h"><span>Pilotos</span><span>${champSel()}<a class="btn sm ghost" href="#/standings">Completa</a></span></h2><div class="card">${driverTable(st.drivers, 8)}</div></div>`;
  const blockTeams = `<div><h2 class="sec-h"><span>Construtores</span><a class="btn sm ghost" href="#/standings">Completa</a></h2><div class="card">${teamTable(st.teams)}</div></div>`;
  const row = (a, b) => (a || b) ? `<section class="sec"><div class="cols">${a || ''}${b || ''}</div></section>` : '';
  return `
  <section class="hero" style="background-image:url('${safeUrl(cfg('hero_image'))}')"><div class="inner">
    <div class="eyebrow">${nr ? (nr.status === 'live' ? 'Acontecendo agora' : 'Próximo Grand Prix') : esc(cfg('site_name'))}</div>
    ${nr ? `<h1>${flag(nr.country_code)} ${esc(nr.name)}</h1><p>${esc(nr.circuit || '')} · ${esc(nr.country || '')} · ${fmtDate(nr.race_date, { weekday: 'long', day: '2-digit', month: 'long' })} às ${fmtTime(nr.race_date)}</p>
    <div class="count" id="count" data-t="${nr.race_date}" data-live="${nr.status === 'live'}"></div>
    <a class="btn red" href="#/race/${nr.id}">Detalhes da corrida →</a>` : `<h1>${esc(cfg('welcome_title'))}</h1><p>${esc(cfg('welcome_text'))}</p><p style="margin-top:12px" class="muted">Nenhuma corrida agendada no momento.</p>`}
  </div></section>
  ${banner && on('show_banner') ? `<div class="partner"><img src="${banner}" alt="Parceiro oficial"></div>` : ''}
  ${row(on('show_last') && blockLast, on('show_next') && blockNext)}
  ${row(on('show_drivers') && blockDrv, on('show_teams') && blockTeams)}
  ${on('show_news') ? `<section class="sec"><h2 class="sec-h"><span>Anúncios oficiais</span><a class="btn sm ghost" href="#/news">Todos</a></h2>
    <div class="cols3">${sortedNews().slice(0, 3).map(n => newsCard(n)).join('') || '<div class="card empty">Sem anúncios.</div>'}</div></section>` : ''}`;
};

PAGES.calendar = () => {
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1), startOff = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
  const base = D.races.filter(r => (S.calChamp === 'all' || r.championship_id === S.calChamp) && (S.calKind === 'all' || sessOf(r) === S.calKind));
  const cells = [];
  for (let i = 0; i < startOff; i++) cells.push('<div></div>');
  for (let d = 1; d <= days; d++) {
    const dayT = new Date(y, mo, d).getTime(), sess = base.filter(r => { if (!r.start_date) return false; const a = new Date(r.start_date), b = new Date(r.race_date), a0 = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime(), b0 = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime(); return dayT >= a0 && dayT < b0; });
    const rcs = base.filter(r => { const x = new Date(r.race_date); return x.getFullYear() === y && x.getMonth() === mo && x.getDate() === d; }), rc = rcs[0] || sess[0];
    const today = new Date(); const isT = today.getFullYear() === y && today.getMonth() === mo && today.getDate() === d;
    cells.push(`<div class="d ${rc ? 'race' : ''} ${isT ? 'today' : ''}" ${rc ? `data-go="#/race/${rc.id}"` : ''}>${d}${rcs.map(x => `<span>${sessOf(x) === 'race' ? flag(x.country_code) : '<b>' + SESS[sessOf(x)] + '</b>'} ${esc(x.name.replace('Grande Prêmio ', 'GP '))}</span>`).join('')}${sess.map(x => `<span>${esc(x.name.replace('Grande Prêmio ', 'GP '))}</span>`).join('')}</div>`);
  }
  const f = S.calFilter;
  const list = base.filter(r => f === 'all' || r.status === f).sort((a, b) => new Date(a.race_date) - new Date(b.race_date));
  const sel = D.championships.length ? `<select data-change="calChamp" style="width:auto;min-width:200px"><option value="all">Todas as categorias</option>${D.championships.map(c => `<option value="${c.id}" ${S.calChamp === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : '';
  return `${pageHead('Calendário da temporada', 'Todas as etapas, horários e circuitos.', sel + (isStaff() ? '<button class="btn red" data-act="entNew" data-v="races">+ Adicionar sessão</button>' : ''))}
  <div class="cols"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px">
    <button class="btn sm" data-act="calPrev">←</button><h3>${m.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</h3><button class="btn sm" data-act="calNext">→</button></div>
    <div class="cal">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(x => `<div class="h">${x}</div>`).join('')}${cells.join('')}</div></div>
    <div><div class="chips" style="margin-bottom:8px">${['all', ...Object.keys(SESS)].map(k => `<button class="chip ${S.calKind === k ? 'on' : ''}" data-act="calKind" data-v="${k}">${k === 'all' ? 'Todos os tipos' : SESS[k]}</button>`).join('')}</div>
    <div class="chips" style="margin-bottom:12px">${['all', 'upcoming', 'live', 'finished'].map(s => `<button class="chip ${f === s ? 'on' : ''}" data-act="calFilter" data-v="${s}">${s === 'all' ? 'Todas' : STATUS[s]}</button>`).join('')}</div>
    <div style="display:grid;gap:12px">${list.map(raceCardAdm).join('') || '<div class="card empty">Sem corridas.</div>'}</div></div></div>`;
};

PAGES.race = id => {
  const r = D.races.find(x => x.id === id);
  if (!r) return '<div class="card empty">Corrida não encontrada.</div>';
  const ch = champOf(r.championship_id), bg = safeUrl(r.image_url) || safeUrl(cfg('track_image'));
  return `<a href="#/calendar" class="muted">← Calendário</a>
  <section class="hero sm" style="margin-top:12px;background-image:url('${bg}');background-position:center"><div class="inner"><div class="eyebrow">${esc(ch?.name || cfg('site_name'))} · ${roundLbl(r)}</div>
  <h1>${flag(r.country_code)} ${esc(r.name)}</h1><p>${esc(r.circuit || '')} · ${esc(r.country || '')}<br>${r.start_date ? `Início: ${fmtDate(r.start_date, { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })} às ${fmtTime(r.start_date)}<br>Final: ` : 'Corrida: '}${fmtDate(r.race_date, { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })} às ${fmtTime(r.race_date)}
  ${r.laps ? `<br>${r.laps} voltas` : ''}</p>
  <p style="margin-top:12px"><span class="tag ${r.status}">${STATUS[r.status]}</span> <button class="btn sm ghost" data-act="ics" data-v="${r.id}">+ Adicionar ao meu calendário</button></p></div></section>

  ${r.description ? `<section class="sec"><div class="card" style="white-space:pre-line">${esc(r.description)}</div></section>` : ''}
  ${isStaff() ? `<div class="row" style="margin-top:14px"><button class="btn sm" data-act="entEdit" data-v="races" data-id="${r.id}">Editar corrida</button><button class="btn sm" data-act="goResults" data-id="${r.id}">Lançar resultados</button></div>` : ''}
  <section class="sec"><h2>Resultados</h2><div class="card">${resultTable(r.id)}</div></section>`;
};

PAGES.standings = () => {
  const st = standings(S.champ), ch = champOf(S.champ);
  return `${pageHead(esc(ch?.name || 'Classificações'), esc(ch?.description || 'Campeonato de pilotos e de construtores.'), champSel() + '<button class="btn" data-act="csv">Exportar CSV</button>' + (isAdmin() ? '<button class="btn" data-act="entNew" data-v="championships">+ Nova categoria</button>' : ''), ch?.image_url, ch?.color)}
  <section class="sec" style="margin-top:0"><h2>Campeonato de pilotos</h2><div class="card">${driverTable(st.drivers)}</div></section>
  <section class="sec"><h2>Campeonato de construtores</h2><div class="card">${teamTable(st.teams)}</div></section>
  <section class="sec"><h2>Classificação por equipes</h2><div class="cols3">${st.teams.map(x => {
    const ds = st.drivers.filter(y => y.d.team_id === x.t.id);
    return `<div class="card" style="border-top:3px solid ${safeColor(x.t.color)}"><div class="row" style="gap:10px;margin-bottom:6px">${teamLogo(x.t, 30)}<h3>${esc(x.t.name)}</h3></div><p class="muted" style="margin-bottom:10px">${x.pts} pts</p>${ds.map(y => `<div class="row" style="justify-content:space-between"><a href="#/driver/${y.d.id}">${esc(y.d.name)}</a><b class="display">${y.pts}</b></div>`).join('') || '<span class="muted">Sem pilotos</span>'}</div>`; }).join('') || '<div class="card empty">Sem equipes nesta categoria.</div>'}</div></section>`;
};

PAGES.drivers = () => {
  const st = standings(S.champ);
  return `${pageHead('Pilotos', 'Grid oficial da categoria.', champSel() + (isAdmin() ? '<button class="btn red" data-act="entNew" data-v="drivers">+ Adicionar piloto</button>' : ''))}
  ${st.drivers.length > 6 ? '<input type="search" id="drvSearch" placeholder="Buscar piloto ou equipe…" aria-label="Buscar piloto" style="margin:0 0 14px;max-width:340px">' : ''}
  <div class="cols3" id="drvGrid">${st.drivers.map(x => { const t = teamOf(x.d.team_id); return `<a href="#/driver/${x.d.id}" data-q="${esc((x.d.name + ' ' + (t?.name || '') + ' ' + (x.d.number ?? '')).toLowerCase())}" class="card hover drv-card" style="border-top:3px solid ${safeColor(t?.color)}">
  ${avatarHTML(x.d, 'avatar')}<h3>${esc(x.d.name)}</h3><p class="muted">${flag(x.d.country_code)} #${x.d.number ?? '—'}</p><p class="muted">${teamLogo(t, 20)}${esc(t?.name || 'Sem equipe')}</p><p class="display" style="font-size:22px;margin-top:6px">${x.pts} pts</p></a>`; }).join('') || '<div class="card empty">Sem pilotos.</div>'}</div>`;
};

PAGES.driver = id => {
  const d = driverOf(id);
  if (!d) return '<div class="card empty">Piloto não encontrado.</div>';
  
  const t = teamOf(d.team_id);
  
  const rs = D.results.filter(r => {
    if (r.driver_id !== id) return false;
    const race = D.races.find(x => x.id === r.race_id);
    return race && sessOf(race) === 'race' && sx(r).startsWith('RACE');
  });
  
  const allDriverResults = D.results.filter(r => r.driver_id === id);
  const driverRaceIds = [...new Set(allDriverResults.map(r => r.race_id))];

  let polesCount = 0;
  driverRaceIds.forEach(rId => {
    const rResults = allDriverResults.filter(r => r.race_id === rId);
    const hasPole = rResults.some(r => r.pole || (sx(r).startsWith('RACE') && r.grid === 1));
    if (hasPole) polesCount++;
  });

  const fin = rs.filter(r => r.status === 'FIN');
  const flCount = allDriverResults.filter(r => r.fastest_lap).length;

  const hist = D.results.filter(r => r.driver_id === id)
    .map(r => ({ r, race: D.races.find(x => x.id === r.race_id) }))
    .filter(x => x.race && sx(x.r) === mainSess(x.race))
    .sort((a, b) => new Date(b.race.race_date) - new Date(a.race.race_date));

  return `<a href="#/drivers" class="muted">← Pilotos</a>
  <section class="card" style="margin-top:12px;border-left:4px solid ${safeColor(t?.color)}"><div class="drv-head">
    ${safeUrl(d.photo_url) ? `<img class="avatar" style="width:120px;height:120px" src="${safeUrl(d.photo_url)}" alt="">` : `<div class="avatar" style="width:120px;height:120px;font-size:38px">${initials(d.name)}</div>`}
    <div class="big" style="color:${safeColor(t?.color)}">${d.number ?? ''}</div>
    <div><h1 style="font-size:38px">${esc(d.name)}</h1><p class="muted">${flag(d.country_code)} ${esc(d.nationality || '')} · ${teamLogo(t, 24)}${esc(t?.name || 'Sem equipe')}</p>
    ${isAdmin() ? `<p style="margin-top:10px"><button class="btn sm" data-act="entEdit" data-v="drivers" data-id="${d.id}">Editar piloto</button></p>` : ''}</div></div></section>
  <section class="sec"><div class="stats">
    <div class="stat"><b>${rs.reduce((a, r) => a + Number(r.points || 0), 0)}</b><small>Pontos</small></div>
    <div class="stat"><b>${fin.filter(r => r.position === 1).length}</b><small>Vitórias</small></div>
    <div class="stat"><b>${fin.filter(r => r.position <= 3).length}</b><small>Pódios</small></div>
    <div class="stat"><b>${polesCount}</b><small>Pole Positions</small></div>
    <div class="stat"><b>${flCount}</b><small>Voltas Rápidas</small></div>
    <div class="stat"><b>${d.titles || 0}</b><small>Campeonatos</small></div>
    <div class="stat"><b>${rs.length}</b><small>Corridas</small></div></div></section>
  <section class="sec"><h2>Histórico de resultados</h2><div class="card">${hist.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Corrida</th><th>Data</th><th>Grid</th><th>Pos</th><th style="text-align:right">Pts</th></tr></thead><tbody>

};

/* campos de formulário reutilizáveis */
function fieldHTML(f, v) {
  const n = `name="${f.k}"${f.req ? ' required' : ''}`, help = f.help ? `<div class="hint">${esc(f.help)}</div>` : '';
  if (f.t === 'bool') return `<label class="chk"><input type="checkbox" name="${f.k}" ${v === undefined || v === null ? (f.def === false ? '' : 'checked') : (v ? 'checked' : '')}> ${f.l}</label>`;
  let inp;
  if (f.t === 'textarea') inp = `<textarea ${n} class="${f.code ? 'code' : ''}" ${f.code ? 'spellcheck="false"' : ''}>${esc(v || '')}</textarea>`;
  else if (f.t === 'select') inp = `<select ${n}>${f.noblank ? '' : '<option value="">—</option>'}${f.o().map(([val, lab]) => `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;

async function uploadMedia(file, folder) {
  if (!file || !file.size) return null;
  if (file.size > 4e6) throw new Error('A imagem precisa ter menos de 4 MB.');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const up = await sb.storage.from('media').upload(path, file, { upsert: false, contentType: file.type });
  if (up.error) throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

  if (btn) btn.disabled = true;
  try {
    if (type === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(fd.get('username')), password: fd.get('password') });
      if (error) throw new Error(/invalid/i.test(error.message) ? 'Nome de usuário ou senha incorretos.' : error.message);
      await loadMe();
      if (me.profile?.status === 'suspended') { await sb.auth.signOut(); me = { user: null, profile: null }; throw new Error('Esta conta está suspensa.'); }
      toast('Bem-vindo!'); location.hash = '#/profile'; await refresh();
    } else if (type === 'register') {
      const un = (fd.get('username') || '').trim();
      if (!/^[A-Za-z0-9_]{3,24}$/.test(un)) throw new Error('Nome de usuário: 3 a 24 caracteres, só letras, números e _.');
      if (fd.get('password') !== fd.get('password2')) throw new Error('As senhas não são iguais.');
      const { data, error } = await sb.auth.signUp({ email: toEmail(un), password: fd.get('password'), options: { data: { username: un } } });
      if (error) throw new Error(/already|registered/i.test(error.message) ? 'Esse nome de usuário já está em uso.' : error.message);
      if (!data.session) { toast('Conta criada, mas o Supabase ainda exige confirmação de e-mail. Desligue "Confirm email" em Authentication → Providers → Email.', true); location.hash = '#/login'; }
      else { await loadMe(); toast(me.profile?.status === 'active' ? 'Conta criada! Você é administrador.' : 'Conta criada! Aguarde a aprovação do staff.'); location.hash = '#/profile'; await refresh(); }
    } else if (type === 'changepw') {
      const { error } = await sb.auth.updateUser({ password: fd.get('password') });
      if (error) throw error; f.reset(); toast('Senha alterada.');
    } else if (type === 'profile') {
      let avatar_url = me.profile?.avatar_url || null;
      const file = fd.get('avatar');
      if (file && file.size) {
        if (file.size > 3e6) throw new Error('A imagem precisa ter menos de 3 MB.');
        const path = `${me.user.id}/avatar-${Date.now()}.${(file.name.split('.').pop() || 'png').toLowerCase()}`;
        const up = await sb.storage.from('avatars').upload(path, file, { upsert: true });
        if (up.error) throw up.error;
        avatar_url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from('profiles').update({ username: fd.get('username'), avatar_url }).eq('id', me.user.id);
      if (error) throw error; await loadMe(); toast('Perfil atualizado.'); await refresh();
    } else if (type === 'myteam') {
      const { error } = await sb.from('teams').update({ name: fd.get('name'), color: fd.get('color'), logo_url: await imgVal(fd, 'logo_url', 'teams') }).eq('id', f.dataset.id);
      if (error) throw error; toast('Equipe atualizada.'); await refresh();
    } else if (type === 'ent') {
      const key = f.dataset.key, E = ENT[key], row = {}, id = f.dataset.id;
      for (const fl of E.fields) {
        let v = fd.get(fl.k);
        if (fl.t === 'bool') v = f.elements[fl.k].checked;
        else if (fl.t === 'image') v = await imgVal(fd, fl.k, key);
        else if (fl.t === 'country') { row[fl.k2] = v || null; v = v ? countryName(v) : null; }
        else if (v === '' || v === null) v = null;
        else if (fl.t === 'number') v = Number(v);
        else if (fl.t === 'datetime') v = new Date(v).toISOString();
        row[fl.k] = v;
      }
      if (key === 'races') row.format = row.format || null;
      if (key === 'championships') {
        if (!/^\s*\d+(\s*,\s*\d+)*\s*$/.test(row.points_scale || '')) throw new Error('Sistema de pontos inválido. Use números separados por vírgula, ex.: 25,18,15,12,10.');
        row.points_scale = row.points_scale.replace(/\s/g, ''); row.fl_bonus = row.fl_bonus ?? 0;
        if (!row.season_id) {
          let s = D.seasons.find(x => x.is_active) || D.seasons[0];
          if (!s) { const y = new Date().getFullYear(); const r = await sb.from('seasons').insert({ name: 'Temporada ' + y, year: y, is_active: true }).select().single(); if (r.error) throw r.error; s = r.data; }
          row.season_id = s.id;
        }
      }
      if (key === 'seasons' && row.is_active) await sb.from('seasons').update({ is_active: false }).neq('id', id || '00000000-0000-0000-0000-000000000000');
      if (key === 'news' && !id) row.author_id = me.user.id;
      const res = await (id ? sb.from(key).update(row).eq('id', id) : sb.from(key).insert(row).select().single());
      if (res.error) throw res.error;
      if (!id && key === 'championships' && res.data) { S.champ = res.data.id; S.admCat = 'all'; }
      $('#dlg').close(); toast(id ? 'Salvo.' : (key === 'championships' ? 'Categoria criada.' : 'Adicionado.')); await refresh();
    } else if (type === 'driver') {
      const cat = fd.get('championship_id'), id = f.dataset.id;
      const num = fd.get('number') === '' ? null : Number(fd.get('number'));
      if (num !== null && D.drivers.some(d => d.id !== id && d.championship_id === cat && d.number === num)) throw new Error(`O número ${num} já está em uso nesta categoria.`);
      let teamId = fd.get('team_id') || null; const color = fd.get('team_color'), logo = await imgVal(fd, 'team_logo', 'teams');
      if (teamId === '__new') {
        const name = (fd.get('new_team_name') || '').trim(); if (!name) throw new Error('Informe o nome da nova equipe.');
        const r = await sb.from('teams').insert({ name, short_name: name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(), color, logo_url: logo, championship_id: cat }).select().single();
        if (r.error) throw r.error; teamId = r.data.id;
      } else if (teamId) {
        const t = teamOf(teamId), up = {};
        if (t && (t.color || '').toLowerCase() !== color.toLowerCase()) up.color = color;
        if (t && logo !== (t.logo_url || null)) up.logo_url = logo;
        if (Object.keys(up).length) { const r = await sb.from('teams').update(up).eq('id', teamId); if (r.error) throw r.error; }
      }
      const cc = fd.get('country') || null;
      const row = { championship_id: cat, name: fd.get('name').trim(), number: num, nationality: cc ? countryName(cc) : null, country_code: cc, team_id: teamId,
        photo_url: await imgVal(fd, 'photo_url', 'drivers'), titles: Number(fd.get('titles') || 0), profile_id: fd.get('profile_id') || null, active: f.elements.active.checked };
      const { error } = await (id ? sb.from('drivers').update(row).eq('id', id) : sb.from('drivers').insert(row));
      if (error) throw error;
      $('#dlg').close(); toast(id ? 'Piloto atualizado.' : 'Piloto adicionado à categoria.'); await refresh();
    } else if (type === 'settings') {
      const up = [], del = [];
      for (const [, fs] of SET_FIELDS) for (const fl of fs) {
        let v;
        if (fl.t === 'bool') v = f.elements[fl.k].checked ? '' : '0';
        else if (fl.t === 'image') v = await imgVal(fd, fl.k, 'site') || '';
        else { v = (fd.get(fl.k) || '').trim(); if (['color', 'select'].includes(fl.t) && v.toLowerCase() === String(DEFS[fl.k]).toLowerCase()) v = ''; }
        if (v) up.push({ key: fl.k, value: v }); else del.push(fl.k);
      }
      if (up.length) { const r = await sb.from('settings').upsert(up, { onConflict: 'key' }); if (r.error) throw r.error; }
      if (del.length) { const r = await sb.from('settings').delete().in('key', del); if (r.error) throw r.error; }
      toast('Personalização salva.'); await refresh();
    } else if (type === 'results') {
      const rows = [], del = [];
      f.querySelectorAll('tbody tr[data-d]').forEach(tr => {
        const g = n => tr.querySelector(`[name=${n}]`), did = tr.dataset.d, d = driverOf(did);
        const pos = g('position').value, status = g('status').value;
        const lapIn = g('lap'), hasLap = !!(lapIn && lapIn.value.trim());
        if (!pos && status === 'FIN' && !hasLap) { del.push(did); return; }
        const sNow = curSess(D.races.find(r => r.id === S.resRace)), timed = isTimed(sNow);
        const lap = timed ? (g('lap').value || '').trim() : '';
        if (lap && !/^(\d{1,2}:)?\d{1,2}[.,]\d{1,3}$/.test(lap)) throw new Error(`Tempo inválido para ${d?.name || 'piloto'}. Use o formato 1:32.456`);
        rows.push({ race_id: S.resRace, session: sNow, driver_id: did, team_id: d?.team_id || null,
          ...(timed ? { lap_time: lap ? lap.replace(',', '.') : null } : { grid: g('grid').value ? Number(g('grid').value) : null }),
          position: pos ? Number(pos) : null, status, penalty_seconds: Number(g('ps').value || 0), penalty_points: Number(g('pp').value || 0),
          pole: g('pole').checked, fastest_lap: g('fl').checked });
      });
      const pos = rows.filter(r => r.status === 'FIN' && r.position).map(r => r.position);
      if (new Set(pos).size !== pos.length) throw new Error('Existem posições repetidas.');
      if (rows.length) { const { error } = await sb.from('results').upsert(rows, { onConflict: 'race_id,session,driver_id' }); if (error) throw error; }
      if (del.length) { const { error } = await sb.from('results').delete().eq('race_id', S.resRace).eq('session', curSess(D.races.find(r => r.id === S.resRace))).in('driver_id', del); if (error) throw error; }
      if (fd.get('finish')) { const { error } = await sb.from('races').update({ status: 'finished' }).eq('id', S.resRace); if (error) throw error; }
      toast('Resultados publicados. Classificações atualizadas.'); await refresh();
    }
  } catch (err) { toast(err.message || 'Ocorreu um erro.', true); }
  finally { if (btn) btn.disabled = false; }
});

/* ---------- arranque ---------- */
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); route(); });
(async () => {
  sb.auth.onAuthStateChange(async ev => { if (ev === 'SIGNED_OUT') { me = { user: null, profile: null }; renderNav(); } });
  if (sb.init) await sb.init();
  await loadMe();
  await loadData();
  await route();
})();
</script>
</body>
</html>
