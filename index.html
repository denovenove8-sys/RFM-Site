<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFM — Real Formula Motorsports</title>
<meta name="description" content="Plataforma oficial da RFM — Real Formula Motorsports: calendário, resultados, classificações, pilotos e equipes.">
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0f10; --panel:#16181a; --panel2:#1e2124; --line:#2a2e31;
  --text:#e9e6e0; --muted:#8e9295; --red:#b5322c; --red2:#cf4a3e; --green:#5f8f66; --amber:#c79a3b;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(900px 400px at 85% -10%,rgba(181,50,44,.14),transparent 70%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px)}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:600;line-height:1.1}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* NAV */
header.nav{position:sticky;top:0;z-index:50;background:rgba(14,15,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:44px;width:auto}
.logo b{font-family:'Oswald';letter-spacing:.1em;font-size:17px;line-height:1.05;text-transform:uppercase}
.logo b small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.22em;font-weight:500}
.links{display:flex;gap:4px;margin-left:auto;align-items:center}
.links a{padding:8px 12px;border-radius:6px;font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);transition:.2s}
.links a:hover,.links a.on{color:var(--text);background:var(--panel2)}
.links a.on{box-shadow:inset 0 -2px var(--red)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.demo-bar{background:#2a2113;color:#e2c27d;font-size:13px;text-align:center;padding:6px 12px;border-bottom:1px solid #3d2f18}

/* BUTTONS / FORMS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:13px;transition:.2s}
.btn:hover{border-color:#444;transform:translateY(-1px)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--red2)}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.ghost{background:transparent}
.btn.danger{color:#e48a80;border-color:#5a2c28}
label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 4px;font-family:'Oswald'}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
input[type=checkbox]{width:auto;accent-color:var(--red)}
input[type=color]{padding:2px;height:40px;cursor:pointer}
input[type=file]{padding:8px;font-size:13px}
textarea{min-height:110px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:4px;text-transform:none;letter-spacing:0;font-family:'Barlow'}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.imgf .prev{height:70px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#0a0a0b;margin-bottom:6px;padding:4px}
.imgf input[type=url]{margin-bottom:6px}
.chk{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text);letter-spacing:0;font-family:'Barlow';margin-top:14px}

/* LAYOUT */
main{padding:28px 0 60px;animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.25s}
.card.hover:hover{border-color:#3d4246;transform:translateY(-2px)}
.sec{margin-top:36px}
.sec>h2,.sec-h{display:flex;align-items:center;gap:12px;font-size:22px;margin-bottom:16px}
.sec>h2::before,.sec-h span::before{content:"";width:5px;height:22px;background:var(--red);transform:skewX(-18deg);display:block}
.sec-h{justify-content:space-between}
.sec-h span{display:flex;align-items:center;gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-family:'Oswald';letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.tag.upcoming{color:var(--amber);border-color:#52421d}
.tag.live{color:#fff;background:var(--red);border-color:var(--red);animation:pulse 1.6s infinite}
.tag.finished{color:var(--green);border-color:#2f4a34}
.tag.pin{color:var(--amber);border-color:#52421d}
@keyframes pulse{50%{opacity:.6}}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background-color:#121314;background-size:cover;background-position:right center;padding:48px 40px;min-height:430px;display:flex;align-items:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,15,16,.97) 0%,rgba(14,15,16,.9) 30%,rgba(14,15,16,.45) 58%,rgba(14,15,16,0) 82%)}
.hero .inner{position:relative;max-width:540px}
.hero.sm{min-height:240px;padding:34px 36px}
.eyebrow{font-family:'Oswald';letter-spacing:.3em;font-size:12px;color:var(--red2);text-transform:uppercase}
.hero h1{font-size:clamp(32px,5vw,56px);margin:10px 0 6px}
.hero p{color:#b9b6b0}
.count{display:flex;gap:10px;margin:22px 0}
.count div{background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:8px;min-width:72px;padding:10px 8px;text-align:center}
.count b{display:block;font-family:'Oswald';font-size:30px;letter-spacing:.04em}
.count small{font-size:10px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.pagehead{border-radius:14px;padding:30px 32px;margin-bottom:24px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(14,15,16,.96),rgba(14,15,16,.72)),var(--bgimg) center/cover;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(28px,4vw,40px)}
.pagehead p{color:#b9b6b0;max-width:560px;margin-top:6px}
.partner{margin-top:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d0d10}
.partner img{width:100%;max-height:120px;object-fit:contain}
.pinned{border-color:#52421d;background:linear-gradient(90deg,#211b10,var(--panel))}

/* TABLES */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:'Oswald';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:.15s}
.tbl tr.click:hover{background:var(--panel2)}
.tbl .pos{font-family:'Oswald';font-size:18px;width:44px;color:var(--muted)}
.tbl tr:nth-child(1) .pos{color:var(--amber)}
.tbl .pts{font-family:'Oswald';font-size:18px;text-align:right}
.scroll{overflow-x:auto}
.bar{display:inline-block;width:4px;height:18px;border-radius:2px;margin-right:10px;vertical-align:middle}
.num{font-family:'Oswald';color:var(--muted);margin-left:6px}
.thumb{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--panel2);border:2px solid var(--line);display:inline-grid;place-items:center;font-family:'Oswald';font-size:13px;color:var(--muted);vertical-align:middle;margin-right:10px;flex:none}

/* CARDS */
.race-card{display:flex;gap:14px;align-items:center}
.race-card .date{font-family:'Oswald';text-align:center;min-width:56px;border-right:1px solid var(--line);padding-right:14px}
.race-card .date b{display:block;font-size:26px}
.race-card .date small{color:var(--red2);letter-spacing:.15em;text-transform:uppercase;font-size:11px}
.news-card h3{font-size:18px;margin:8px 0}
.news-card .img{height:150px;border-radius:8px;margin-bottom:12px;background:linear-gradient(135deg,#25282b,#15171a);background-size:cover;background-position:center}
.news-card p.body{white-space:pre-line}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-family:'Oswald';font-size:28px;color:var(--muted)}
.drv-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.drv-head .big{font-size:84px;font-family:'Oswald';color:var(--red);line-height:1;opacity:.9}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.stat b{display:block;font-family:'Oswald';font-size:32px}
.stat small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer;font-family:'Oswald';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.drv-card{text-align:center}
.drv-card .avatar{margin:0 auto 10px;width:96px;height:96px}

/* CALENDAR GRID */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-family:'Oswald';font-size:11px;color:var(--muted);text-align:center;letter-spacing:.12em;padding:4px}
.cal .d{min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--muted)}
.cal .d.race{background:#2a1a19;border-color:var(--red);cursor:pointer;color:var(--text)}
.cal .d.race span{display:block;font-size:11px;color:var(--red2);margin-top:2px;line-height:1.2}
.cal .d.today{box-shadow:inset 0 0 0 1px var(--amber)}

/* ADMIN */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h3{margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.auth{max-width:420px;margin:30px auto}
.auth h2{margin-bottom:6px}
.empty{padding:26px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}
footer .foot{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
footer img{height:46px;width:auto}
footer a{color:var(--text);margin-left:12px;text-decoration:underline;text-underline-offset:3px}
.skel{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--panel) 0,var(--panel2) 50%,var(--panel) 100%);background-size:200%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:860px){
  .burger{display:block}
  .links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;margin:0}
  .links.open{display:flex}
  .cols,.cols3,.grid2{grid-template-columns:1fr}
  .hero{padding:28px 22px;min-height:380px;background-position:70% center}
  .hero::before{background:linear-gradient(180deg,rgba(14,15,16,.55),rgba(14,15,16,.94) 70%)}
  .hero{align-items:flex-end}
  .count b{font-size:24px}.count div{min-width:60px}
  .drv-head .big{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '🏁';
const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#b5322c';
const safeUrl = u => /^(https?:\/\/|data:image\/)/i.test(u || '') ? esc(u) : '';
const fmtDate = (d, o) => new Date(d).toLocaleDateString('pt-BR', o || { day: '2-digit', month: 'short', year: 'numeric' });

/* ---------- pontos (espelha o trigger do servidor; usado só no modo demo) ---------- */
function calcPoints(r, c) {
  const scale = String(c?.points_scale || '25,18,15,12,10,8,6,4,2,1').split(',').map(Number);
  const bonus = c?.fl_bonus ?? 1;
  let b = 0;
  if (r.status === 'FIN' && r.position >= 1 && r.position <= scale.length) { b = scale[r.position - 1]; if (r.fastest_lap) b += bonus; }
  return Math.max(0, b - (r.penalty_points || 0));
}

/* ---------- carregamento ---------- */
async function loadData() {
  if (!sb) { D = buildDemo(); pickChamp(); applySettings(); return; }
  const q = (t, f) => { let r = sb.from(t).select('*'); return f ? f(r) : r; };
  const [teams, drivers, seasons, championships, races, results, news, settings] = await Promise.all([
    q('teams'), q('drivers'), q('seasons', r => r.order('year', { ascending: false })), q('championships'),
    q('races', r => r.order('race_date')), q('results'), q('news', r => r.order('created_at', { ascending: false })), q('settings')
  ]);
  const err = [teams, drivers, seasons, championships, races, results, news].find(x => x.error);
  if (err) toast('Erro ao carregar dados: ' + err.error.message + ' (você rodou o schema.sql?)', true);
  const set = {}; (settings.data || []).forEach(r => { if (r.value) set[r.key] = r.value; });
  D = { teams: teams.data || [], drivers: drivers.data || [], seasons: seasons.data || [], championships: championships.data || [],
        races: races.data || [], results: results.data || [], news: news.data || [], profiles: D.profiles || [], settings: set };
  if (isStaff()) { const p = await sb.from('profiles').select('*').order('created_at', { ascending: false }); D.profiles = p.data || []; }
  pickChamp(); applySettings();
}
function pickChamp() {
  if (S.champ && champOf(S.champ)) return;
  const act = D.seasons.find(s => s.is_active);
  const c = D.championships.find(c => act && c.season_id === act.id) || D.championships[D.championships.length - 1];
  S.champ = c ? c.id : null;
}
async function loadMe() {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  me.user = session?.user || null; me.profile = null;
  if (me.user) { const { data } = await sb.from('profiles').select('*').eq('id', me.user.id).maybeSingle(); me.profile = data; }
}

/* ---------- personalização do site ---------- */
function mix(hex, p) {
  const n = parseInt(safeColor(hex).slice(1, 7), 16), f = c => Math.round(c + (255 - c) * p);
  return `rgb(${f((n >> 16) & 255)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function applySettings() {
  const root = document.documentElement.style, ac = safeColor(cfg('accent'));
  root.setProperty('--red', ac); root.setProperty('--red2', mix(ac, .18));
  const lg = safeUrl(cfg('logo_url'));
  $('#logo').innerHTML = `${lg ? `<img src="${lg}" alt="">` : ''}<b>${esc(cfg('site_name'))}<small>${esc(cfg('site_subtitle'))}</small></b>`;
  $('#favicon').href = lg || '';

    .map(([k, l]) => `<a href="${esc(cfg(k))}" target="_blank" rel="noopener">${l}</a>`).join('');

}

/* ---------- classificações (calculadas a partir dos resultados publicados) ---------- */
function standings(cid) {
  const raceIds = new Set(D.races.filter(r => r.championship_id === cid).map(r => r.id));
  const res = D.results.filter(r => raceIds.has(r.race_id));
  const inCat = x => !x.championship_id || x.championship_id === cid;
  const agg = rs => ({
    pts: rs.reduce((a, r) => a + Number(r.points || 0), 0),
    wins: rs.filter(r => r.position === 1 && r.status === 'FIN').length,
    pod: rs.filter(r => r.position && r.position <= 3 && r.status === 'FIN').length,
    poles: rs.filter(r => r.pole).length, n: rs.length
  });
  const sort = (a, b) => b.pts - a.pts || b.wins - a.wins || b.pod - a.pod;
  const drivers = D.drivers.filter(d => d.active !== false && inCat(d)).map(d => ({ d, ...agg(res.filter(r => r.driver_id === d.id)) })).sort(sort);
  const teams = D.teams.filter(inCat).map(t => ({ t, ...agg(res.filter(r => r.team_id === t.id)) })).sort(sort);
  return { drivers, teams };
}
const champSel = (key = 'champ') => D.championships.length > 1 ? `<select data-change="${key}" style="width:auto;min-width:220px">${D.championships.map(c => `<option value="${c.id}" ${c.id === S.champ ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : '';
const sortedNews = () => [...D.news].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.created_at) - new Date(a.created_at));

function teamTable(rows) {

function resultTable(raceId) {

}
function resultTableTop(raceId, n) {
  const rs = D.results.filter(r => r.race_id === raceId && r.status === 'FIN').sort((a, b) => a.position - b.position).slice(0, n);

}

];
const TABS = () => {
  const t = [];
  if (isAdmin()) t.push(['site', 'Site'], ['championships', 'Campeonatos'], ['seasons', 'Temporadas'], ['drivers', 'Pilotos'], ['teams', 'Equipes']);
  t.push(['races', 'Calendário'], ['results', 'Resultados'], ['news', 'Anúncios']);
  if (isAdmin()) t.push(['users', 'Usuários'], ['audit', 'Histórico']);
  return t;
};
function cellVal(k, v) {
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'team_id') return esc(teamOf(v)?.name || '—');
  if (k === 'championship_id') return esc(champOf(v)?.name || '—');
  if (k === 'principal_id') return esc(D.profiles.find(p => p.id === v)?.username || '—');
  if (k === 'season_id') return esc(D.seasons.find(s => s.id === v)?.name || '—');
  if (k === 'race_date') return fmtDate(v) + ' ' + fmtTime(v);
  if (k === 'created_at') return fmtDate(v);
  if (k === 'kind') return KINDS[v] || v;
  if (k === 'color') return `<span class="bar" style="background:${safeColor(v)};height:14px"></span>${esc(v)}`;
  if (typeof v === 'boolean') return v ? 'Sim' : 'Não';
  if (k === 'status') return `<span class="tag ${v}">${STATUS[v] || v}</span>`;
  return esc(v);
}

PAGES.admin = async () => {
  if (!sb) return '<div class="card empty">O painel de administração requer o Supabase configurado.</div>';
  if (!me.user) return '<div class="card empty">Entre para continuar. <a href="#/login" style="color:var(--red2)">Entrar</a></div>';

  const tabs = TABS();
  if (!S.adminTab || !tabs.find(t => t[0] === S.adminTab)) S.adminTab = tabs[0][0];
  const k = S.adminTab; let body = '';
  if (k === 'site') body = sitePanel();
  else if (k === 'drivers') body = driversPanel();
  else if (ENT[k]) body = entPanel(k);
  else if (k === 'results') body = resultsPanel();
  else if (k === 'users') body = usersPanel();
  else if (k === 'audit') body = await auditPanel();
  return `${pageHead('Painel de administração', `${ROLES[me.profile.role]} · ${esc(me.profile.username)}`)}
  <div class="tabs">${tabs.map(([key, l]) => `<button class="chip ${key === k ? 'on' : ''}" data-act="adminTab" data-v="${key}">${l}</button>`).join('')}</div>${body}`;
};

const catFilter = () => D.championships.length ? `<select data-change="admCat" style="width:auto;min-width:200px"><option value="all">Todas as categorias</option>${D.championships.map(c => `<option value="${c.id}" ${S.admCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : '';

function entPanel(key) {
  const E = ENT[key]; let rows = D[key] || [];
  if (['teams', 'races'].includes(key) && S.admCat !== 'all') rows = rows.filter(r => r.championship_id === S.admCat);
  if (key === 'races') rows = [...rows].sort((a, b) => new Date(a.race_date) - new Date(b.race_date));
  if (key === 'news') rows = sortedNews();
  const extra = r => key === 'races' ? `<select data-change="raceStatus" data-id="${r.id}" style="width:auto;padding:4px 8px;font-size:12px">${Object.entries(STATUS).map(([v, l]) => `<option value="${v}" ${r.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select> <button class="btn sm" data-act="goResults" data-id="${r.id}">Resultados</button> ` : '';
  const head = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>${E.label}</h2><div class="row">${['teams', 'races'].includes(key) ? catFilter() : ''}${key === 'races' ? '<button class="btn" data-act="renumber">Renumerar rodadas por data</button>' : ''}<button class="btn red" data-act="entNew" data-v="${key}">+ Adicionar</button></div></div>`;
  return head + `<div class="card scroll">${rows.length ? `<table class="tbl"><thead><tr>${E.cols.map(c => `<th>${({ number: 'Nº', name: 'Nome', team_id: 'Equipe', championship_id: 'Categoria', short_name: 'Sigla', principal_id: 'Chefe', color: 'Cor', year: 'Ano', is_active: 'Ativa', category: 'Categoria', season_id: 'Temporada', points_scale: 'Pontos', round: 'Rodada', circuit: 'Circuito', race_date: 'Data', status: 'Estado', title: 'Título', kind: 'Tipo', pinned: 'Fixado', created_at: 'Criado', published: 'Publicado' })[c] || c}</th>`).join('')}<th></th></tr></thead><tbody>
  ${rows.map(r => `<tr>${E.cols.map(c => `<td>${cellVal(c, r[c])}</td>`).join('')}<td style="white-space:nowrap;text-align:right">${extra(r)}<button class="btn sm" data-act="entEdit" data-v="${key}" data-id="${r.id}">Editar</button> <button class="btn sm danger" data-act="entDel" data-v="${key}" data-id="${r.id}">Excluir</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nada por aqui ainda. Use “+ Adicionar”.</div>'}</div>`;
}
function driversPanel() {
  let rows = D.drivers; if (S.admCat !== 'all') rows = rows.filter(d => d.championship_id === S.admCat);
  rows = [...rows].sort((a, b) => (a.number ?? 999) - (b.number ?? 999));

/* campos de formulário reutilizáveis */
function fieldHTML(f, v) {
  const n = `name="${f.k}"${f.req ? ' required' : ''}`, help = f.help ? `<div class="hint">${esc(f.help)}</div>` : '';
  if (f.t === 'bool') return `<label class="chk"><input type="checkbox" name="${f.k}" ${v === undefined || v === null ? (f.def === false ? '' : 'checked') : (v ? 'checked' : '')}> ${f.l}</label>`;
  let inp;
  if (f.t === 'textarea') inp = `<textarea ${n}>${esc(v || '')}</textarea>`;
  else if (f.t === 'select') inp = `<select ${n}><option value="">—</option>${f.o().map(([val, lab]) => `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  else if (f.t === 'country') inp = `<select ${n}><option value="">—</option>${COUNTRIES.map(([c, nm]) => `<option value="${c}" ${(f.cur || '').toUpperCase() === c ? 'selected' : ''}>${flag(c)} ${nm}</option>`).join('')}</select>`;
  else if (f.t === 'datetime') { const dt = v ? new Date(new Date(v) - new Date(v).getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : ''; inp = `<input type="datetime-local" ${n} value="${dt}">`; }
  else if (f.t === 'color') inp = `<input type="color" ${n} value="${safeColor(v)}">`;
  else if (f.t === 'image') { const pv = safeUrl(f.prev || v); inp = `<div class="imgf">${pv ? `<img class="prev" src="${pv}" alt="">` : ''}<input type="url" name="${f.k}" value="${esc(v || '')}" placeholder="Cole um link (https://…) ou envie um arquivo abaixo"><input type="file" name="${f.k}__file" accept="image/*"></div>`; }
  else inp = `<input type="${f.t}" ${n} value="${esc(v ?? '')}">`;
  return `<label>${f.l}</label>${inp}${help}`;
}

const NAVL = [['#/', 'Início'], ['#/calendar', 'Calendário'], ['#/standings', 'Classificações'], ['#/drivers', 'Pilotos'], ['#/news', 'Anúncios']];
function renderNav() {

  const l = NAVL.map(([href, t]) => `<a href="${href}" class="${h === href ? 'on' : ''}">${t}</a>`);
  if (isStaff()) l.push(`<a href="#/admin" class="${h.startsWith('#/admin') ? 'on' : ''}">Admin</a>`);

  $('#links').innerHTML = l.join(''); $('#links').classList.remove('open');
}
let countTimer;
async function route() {
  clearInterval(countTimer);
  const h = (location.hash || '#/').slice(2).split('/'), page = h[0] || 'home';
  renderNav();
  const fn = PAGES[page] || PAGES.home;
  const app = $('#app'); app.style.animation = 'none'; void app.offsetWidth; app.style.animation = '';
  app.innerHTML = await fn(h[1]);
  const c = $('#count');
  if (c) { const tick = () => {
    const t = new Date(c.dataset.t) - Date.now();
    if (t <= 0 || c.dataset.live === 'true') { c.innerHTML = '<div style="min-width:160px"><b style="color:var(--red2)">LIVE</b><small>Em pista</small></div>'; return; }
    const v = [Math.floor(t / 864e5), Math.floor(t / 36e5) % 24, Math.floor(t / 6e4) % 60, Math.floor(t / 1e3) % 60];
    c.innerHTML = ['Dias', 'Horas', 'Min', 'Seg'].map((l, i) => `<div><b>${String(v[i]).padStart(2, '0')}</b><small>${l}</small></div>`).join(''); };
    tick(); countTimer = setInterval(tick, 1000); }
}

const needWrite = () => { if (!sb) { toast('Modo demonstração: configure o Supabase para salvar.', true); return true; } return false; };
const ACT = {
  closeDlg: () => $('#dlg').close(),
  logout: async () => { await sb.auth.signOut(); location.hash = '#/'; },

  calNext: () => { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); route(); },

  goResults: el => { S.resRace = el.dataset.id; S.adminTab = 'results'; const same = location.hash === '#/admin'; location.hash = '#/admin'; if (same) route(); },
  entDel: async el => {

    const warn = k === 'championships' ? 'Isto também exclui as corridas e resultados deste campeonato. ' : k === 'races' ? 'Isto também exclui os resultados da corrida. ' : '';
    if (!confirm(warn + 'Excluir este registro? A ação fica registrada no histórico.')) return;

    if (error) return toast(error.message, true);
    toast('Excluído.'); refresh();
  },
  userStatus: async el => {
    const { error } = await sb.from('profiles').update({ status: el.dataset.v }).eq('id', el.dataset.id);
    if (error) return toast(error.message, true);
    toast('Estado atualizado.'); refresh();
  },
  renumber: async () => {
    if (needWrite()) return;
    const groups = {};
    D.races.forEach(r => (groups[r.championship_id] ||= []).push(r));
    const ups = [];
    Object.values(groups).forEach(rs => rs.sort((a, b) => new Date(a.race_date) - new Date(b.race_date)).forEach((r, i) => { if (r.round !== i + 1) ups.push(sb.from('races').update({ round: i + 1 }).eq('id', r.id)); }));
    const res = await Promise.all(ups); const e = res.find(x => x.error);
    if (e) return toast(e.error.message, true);

  resetSite: async () => {

};

/* upload de imagem para o Storage (bucket "media") */
async function uploadMedia(file, folder) {
  if (!file || !file.size) return null;
  if (file.size > 4e6) throw new Error('A imagem precisa ter menos de 4 MB.');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const up = await sb.storage.from('media').upload(path, file, { upsert: false, contentType: file.type });
  if (up.error) throw up.error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
const imgVal = async (fd, k, folder) => { const f = fd.get(k + '__file'); const up = f && f.size ? await uploadMedia(f, folder) : null; return up || (fd.get(k) || '').trim() || null; };

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (needWrite()) return;
  const type = f.dataset.form, fd = new FormData(f), btn = f.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  try {
    if (type === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
      if (error) throw error; await loadMe(); toast('Sessão iniciada.'); location.hash = '#/profile'; await refresh();
    } else if (type === 'register') {
      const { data, error } = await sb.auth.signUp({ email: fd.get('email'), password: fd.get('password'), options: { data: { username: fd.get('username') } } });
      if (error) throw error;
      toast(data.session ? 'Conta criada. Aguarde a aprovação do staff.' : 'Conta criada. Confirme o e-mail e aguarde a aprovação.'); location.hash = '#/login';
    } else if (type === 'reset') {
      const { error } = await sb.auth.resetPasswordForEmail(fd.get('email'), { redirectTo: location.origin + location.pathname });
      if (error) throw error; toast('Enviamos um link de recuperação para o seu e-mail.');
    } else if (type === 'newpass') {
      const { error } = await sb.auth.updateUser({ password: fd.get('password') });
      if (error) throw error; toast('Senha atualizada.'); location.hash = '#/profile';
    } else if (type === 'profile') {
      let avatar_url = me.profile?.avatar_url || null;
      const file = fd.get('avatar');
      if (file && file.size) {
        if (file.size > 3e6) throw new Error('A imagem precisa ter menos de 3 MB.');
        const path = `${me.user.id}/avatar-${Date.now()}.${(file.name.split('.').pop() || 'png').toLowerCase()}`;
        const up = await sb.storage.from('avatars').upload(path, file, { upsert: true });
        if (up.error) throw up.error;
        avatar_url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from('profiles').update({ username: fd.get('username'), avatar_url }).eq('id', me.user.id);
      if (error) throw error; await loadMe(); toast('Perfil atualizado.'); await refresh();
    } else if (type === 'myteam') {
      const { error } = await sb.from('teams').update({ name: fd.get('name'), color: fd.get('color'), logo_url: fd.get('logo_url') || null }).eq('id', f.dataset.id);
      if (error) throw error; toast('Equipe atualizada.'); await refresh();
    } else if (type === 'ent') {
      const key = f.dataset.key, E = ENT[key], row = {};
      for (const fl of E.fields) {
        let v = fd.get(fl.k);
        if (fl.t === 'bool') v = f.elements[fl.k].checked;
        else if (fl.t === 'image') v = await imgVal(fd, fl.k, key);
        else if (fl.t === 'country') { row[fl.k2] = v || null; v = v ? countryName(v) : null; }
        else if (v === '' || v === null) v = null;
        else if (fl.t === 'number') v = Number(v);
        else if (fl.t === 'datetime') v = new Date(v).toISOString();
        row[fl.k] = v;
      }
      if (key === 'championships') {
        if (!/^\s*\d+(\s*,\s*\d+)*\s*$/.test(row.points_scale || '')) throw new Error('Sistema de pontos inválido. Use números separados por vírgula, ex.: 25,18,15,12,10.');
        row.points_scale = row.points_scale.replace(/\s/g, ''); row.fl_bonus = row.fl_bonus ?? 0;
      }
      if (key === 'seasons' && row.is_active) await sb.from('seasons').update({ is_active: false }).neq('id', f.dataset.id || '00000000-0000-0000-0000-000000000000');
      if (key === 'news' && !f.dataset.id) row.author_id = me.user.id;
      const { error } = await (f.dataset.id ? sb.from(key).update(row).eq('id', f.dataset.id) : sb.from(key).insert(row));
      if (error) throw error;
      $('#dlg').close(); toast('Salvo.'); await refresh();
    } else if (type === 'driver') {
      const cat = fd.get('championship_id'), id = f.dataset.id;
      const num = fd.get('number') === '' ? null : Number(fd.get('number'));
      if (num !== null && D.drivers.some(d => d.id !== id && d.championship_id === cat && d.number === num)) throw new Error(`O número ${num} já está em uso nesta categoria.`);
      let teamId = fd.get('team_id') || null; const color = fd.get('team_color');
      if (teamId === '__new') {
        const name = (fd.get('new_team_name') || '').trim(); if (!name) throw new Error('Informe o nome da nova equipe.');
        const r = await sb.from('teams').insert({ name, short_name: name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(), color, championship_id: cat }).select().single();
        if (r.error) throw r.error; teamId = r.data.id;
      } else if (teamId) {
        const t = teamOf(teamId);
        if (t && (t.color || '').toLowerCase() !== color.toLowerCase()) { const r = await sb.from('teams').update({ color }).eq('id', teamId); if (r.error) throw r.error; }
      }
      const cc = fd.get('country') || null;
      const row = { championship_id: cat, name: fd.get('name').trim(), number: num, nationality: cc ? countryName(cc) : null, country_code: cc, team_id: teamId,
        photo_url: await imgVal(fd, 'photo_url', 'drivers'), titles: Number(fd.get('titles') || 0), profile_id: fd.get('profile_id') || null, active: f.elements.active.checked };
      const { error } = await (id ? sb.from('drivers').update(row).eq('id', id) : sb.from('drivers').insert(row));
      if (error) throw error;
      $('#dlg').close(); toast(id ? 'Piloto atualizado.' : 'Piloto adicionado à categoria.'); await refresh();
    } else if (type === 'settings') {
      const up = [], del = [];
      for (const [, fs] of SET_FIELDS) for (const fl of fs) {
        let v = fl.t === 'image' ? await imgVal(fd, fl.k, 'site') : (fd.get(fl.k) || '').trim();
        if (fl.k === 'accent' && v.toLowerCase() === DEFS.accent) v = '';
        if (v) up.push({ key: fl.k, value: v }); else del.push(fl.k);
      }
      if (up.length) { const r = await sb.from('settings').upsert(up, { onConflict: 'key' }); if (r.error) throw r.error; }
      if (del.length) { const r = await sb.from('settings').delete().in('key', del); if (r.error) throw r.error; }
      toast('Personalização salva.'); await refresh();
    } else if (type === 'results') {
      const rows = [], del = [];
      f.querySelectorAll('tbody tr[data-d]').forEach(tr => {
        const g = n => tr.querySelector(`[name=${n}]`), did = tr.dataset.d, d = driverOf(did);
        const pos = g('position').value, status = g('status').value;
        if (!pos && status === 'FIN') { del.push(did); return; }
        rows.push({ race_id: S.resRace, driver_id: did, team_id: d?.team_id || null, grid: g('grid').value ? Number(g('grid').value) : null,
          position: pos ? Number(pos) : null, status, penalty_seconds: Number(g('ps').value || 0), penalty_points: Number(g('pp').value || 0),
          pole: g('pole').checked, fastest_lap: g('fl').checked });
      });
      const pos = rows.filter(r => r.status === 'FIN' && r.position).map(r => r.position);
      if (new Set(pos).size !== pos.length) throw new Error('Existem posições repetidas.');
      if (rows.length) { const { error } = await sb.from('results').upsert(rows, { onConflict: 'race_id,driver_id' }); if (error) throw error; }
      if (del.length) { const { error } = await sb.from('results').delete().eq('race_id', S.resRace).in('driver_id', del); if (error) throw error; }
      if (fd.get('finish')) { const { error } = await sb.from('races').update({ status: 'finished' }).eq('id', S.resRace); if (error) throw error; }
      toast('Resultados publicados. Classificações atualizadas.'); await refresh();
    }
  } catch (err) { toast(err.message || 'Ocorreu um erro.', true); }
  finally { if (btn) btn.disabled = false; }
});

/* ---------- arranque ---------- */
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); route(); });
(async () => {
  if (sb) {
    sb.auth.onAuthStateChange(async ev => {
      if (ev === 'PASSWORD_RECOVERY') location.hash = '#/newpass';
      if (ev === 'SIGNED_OUT') { me = { user: null, profile: null }; renderNav(); }
    });
    await loadMe();
  }
  await loadData();
  await route();
})();
</script>
